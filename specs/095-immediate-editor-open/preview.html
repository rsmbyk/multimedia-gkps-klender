<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immediate editor opening · preview</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; --canvas:#f8f7f4; --panel:#efede8; --ink:#272925; --muted:#686962; --line:#d9d6ce; --green:#1e5a40; --danger:#ac3b33; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:var(--canvas); }
    button { font:inherit; cursor:pointer; }
    .preview-bar { position:fixed; z-index:2; top:16px; right:18px; display:flex; align-items:center; gap:12px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--canvas); box-shadow:0 5px 18px #00000012; font-size:12px; }
    .preview-bar strong { color:var(--muted); font-size:11px; letter-spacing:.07em; text-transform:uppercase; }
    .preview-bar label { display:flex; align-items:center; gap:5px; white-space:nowrap; }
    .preview-bar input { accent-color:var(--green); }
    .shell { display:grid; grid-template-columns:64px minmax(260px,320px) minmax(0,1fr); min-height:100vh; }
    .rail { display:flex; flex-direction:column; align-items:center; gap:18px; padding:22px 8px; background:#e9e6df; border-right:1px solid var(--line); }
    .rail__logo { display:grid; width:38px; height:38px; place-items:center; border-radius:50%; background:#fff; color:#4e74a3; font:700 19px Georgia, serif; }
    .rail__selected { display:grid; width:42px; height:42px; place-items:center; margin-top:145px; border-radius:8px; background:var(--green); color:white; font-size:21px; }
    .rail__plain { color:#393a35; font-size:21px; }
    .panel { padding:32px 16px; border-right:1px solid var(--line); background:#f2f0eb; }
    .filter { height:39px; margin-bottom:20px; padding:10px 13px; border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:13px; }
    .add { width:100%; height:39px; border:0; border-radius:8px; background:var(--green); color:white; font-size:13px; font-weight:650; }
    .section { margin:28px 4px 10px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .row { display:flex; align-items:center; justify-content:space-between; min-height:42px; padding:0 10px; border-radius:8px; font-size:14px; }
    .row.current { background:#bad9ca; }
    .row button { border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--muted); font-size:12px; padding:4px 7px; }
    .stage { max-width:840px; width:100%; margin:0 auto; padding:118px 56px 70px; }
    .eyebrow { color:var(--muted); font-size:14px; font-weight:700; letter-spacing:.16em; }
    h1 { margin:10px 0 28px; font:700 clamp(32px,4vw,48px)/1.15 Georgia,serif; }
    .entry { padding:16px 18px; margin-bottom:12px; border:1px solid #e1ded8; border-radius:10px; }
    .entry__top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .entry__top strong { font-size:15px; }
    .entry__top button { padding:6px 12px; border:1px solid var(--line); border-radius:7px; background:transparent; color:var(--muted); font-size:12px; }
    .entry p { margin:8px 0 0; font:18px/1.6 Georgia,serif; color:#6c5946; }
    .add-entry { padding:9px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--green); font-size:13px; font-weight:650; }
    dialog { width:min(490px,calc(100vw - 32px)); max-height:calc(100dvh - 40px); padding:0; border:1px solid var(--line); border-radius:14px; background:var(--canvas); color:var(--ink); box-shadow:0 20px 55px #00000030; }
    dialog::backdrop { background:#1618148a; }
    .modal { padding:24px; }
    .modal h2 { margin:0 0 8px; font-size:20px; line-height:1.25; }
    .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-height:80px; color:var(--muted); font-size:14px; text-align:center; }
    .spinner { width:18px; height:18px; flex:none; border:2px solid #d6d2c9; border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
    .actions button { height:38px; padding:0 18px; border-radius:9px; font-size:13px; font-weight:600; }
    .cancel { border:1px solid var(--line); background:transparent; color:var(--ink); }
    .save { border:0; background:var(--green); color:white; }
    .field { display:grid; gap:8px; margin:22px 0 12px; font-size:13px; font-weight:600; }
    .field input { width:100%; height:40px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:white; font:14px ui-sans-serif,system-ui,sans-serif; }
    .toast { position:fixed; z-index:4; right:20px; bottom:20px; max-width:min(360px,calc(100vw - 40px)); display:none; padding:13px 16px; border:1px solid var(--line); border-left:3px solid var(--danger); border-radius:10px; background:var(--canvas); box-shadow:0 1px 2px #00000017; font-size:12.5px; }
    .toast strong { display:block; margin-bottom:4px; font-size:14px; }
    .toast.show { display:block; }
    @media (max-width:740px) { .shell { grid-template-columns:58px minmax(0,1fr); } .panel { display:none; } .stage { padding:112px 24px 50px; } .preview-bar { top:10px; right:10px; left:68px; justify-content:space-between; flex-wrap:wrap; } }
    @media (prefers-reduced-motion:reduce) { .spinner { animation:none; } }
  </style>
</head>
<body>
  <div class="preview-bar"><strong>Interactive preview</strong><label><input type="radio" name="response" value="slow" checked>Slow response</label><label><input type="radio" name="response" value="offline">Offline failure</label></div>
  <div class="shell">
    <div class="rail"><div class="rail__logo">✝</div><div class="rail__selected">▤</div><div class="rail__plain">♫</div></div>
    <aside class="panel"><div class="filter">⌕ &nbsp; Filter services…</div><button class="add" data-open="Add Tata Ibadah">＋ &nbsp; Add Tata Ibadah</button><div class="section">June 2026</div><div class="row current"><span>Ibadah Minggu</span><button data-open="Edit Tata Ibadah">Edit</button></div><div class="row">Ibadah Minggu Pelajar</div></aside>
    <main class="stage"><div class="eyebrow">TATA IBADAH</div><h1>Ibadah Minggu</h1><div class="entry"><div class="entry__top"><strong>VOTUM · INTROITUS · DOA</strong><button data-open="Edit entry">Edit entry</button></div><p>L: Marilah kita bangkit berdiri!</p></div><div class="entry"><div class="entry__top"><strong>Second entry</strong></div><p>J: Amin.</p></div><button class="add-entry" data-open="Add Text">＋ &nbsp; Add Text</button></main>
  </div>
  <dialog id="editor" aria-labelledby="editorTitle"><div class="modal" id="editorContent"></div></dialog>
  <div class="toast" id="toast" role="alert"><strong>Could not load editor</strong><span>The editor could not be loaded. Try again.</span></div>
  <script>
    const dialog = document.getElementById('editor');
    const content = document.getElementById('editorContent');
    const toast = document.getElementById('toast');
    let generation = 0;
    let loadTimer = 0;
    let toastTimer = 0;
    function cancel() { dialog.close(); }
    function renderLoading(label) {
      content.innerHTML = `<h2 id="editorTitle">${label}</h2><div class="loading" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>Loading editor…</span></div><div class="actions"><button class="cancel" type="button" data-cancel>Cancel</button></div>`;
      content.querySelector('[data-cancel]').focus();
    }
    function renderForm(label) {
      content.innerHTML = `<h2 id="editorTitle">${label}</h2><label class="field">Title<input type="text" value="${label.startsWith('Edit') ? 'Ibadah Minggu' : ''}"></label><div class="actions"><button class="cancel" type="button" data-cancel>Cancel</button><button class="save" type="button" data-cancel>Save</button></div>`;
      content.querySelector('input').focus();
    }
    function showFailure() {
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3230);
    }
    function open(label) {
      if (dialog.open) return;
      const ownGeneration = ++generation;
      toast.classList.remove('show');
      renderLoading(label);
      dialog.showModal();
      const offline = document.querySelector('input[name="response"]:checked').value === 'offline';
      loadTimer = setTimeout(() => {
        if (!dialog.open || ownGeneration !== generation) return;
        if (offline) { dialog.close(); showFailure(); return; }
        renderForm(label);
      }, offline ? 850 : 2400);
    }
    document.addEventListener('click', event => {
      const opener = event.target.closest('[data-open]');
      if (opener) open(opener.dataset.open);
      if (event.target.closest('[data-cancel]')) cancel();
    });
    dialog.addEventListener('click', event => { if (event.target === dialog) cancel(); });
    dialog.addEventListener('close', () => { generation++; clearTimeout(loadTimer); content.replaceChildren(); });
  </script>
</body>
</html>
