<link rel="stylesheet" href="assets/fonts.css">

<style>
  html, body { margin: 0; }
  /* the app shell makes body a flex row; this preview page is a stack */
  body { display: block; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .bar {
    position: sticky; top: 0; z-index: 40;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 10px 16px;
    background: color-mix(in srgb, var(--rail-bg) 92%, var(--canvas));
    border-bottom: 1px solid var(--divider);
  }
  .bar button {
    padding: 7px 12px; border: 1px solid var(--divider); border-radius: 8px;
    background: var(--canvas); color: var(--ink);
    font: 600 12.5px/1 var(--font-sans); cursor: pointer;
  }
  .bar button[aria-pressed="true"] { background: var(--active-bg); color: var(--active-ink); border-color: var(--active-bg); }
  .bar .note { margin-left: 6px; font: 500 12px/1.35 var(--font-sans); color: var(--head-ink); }
  .bar .spacer { flex: 1; }
  .bar .group-label { font: 600 11px/1 var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--head-ink); margin-right: 2px; }
  .stage2 { width: min(880px, 100vw - 48px); margin: 0 auto; padding: 26px 0 120px; }
  .frame { margin-top: 34px; padding-top: 8px; border-top: 2px solid var(--divider); }
  .frame > h2 { font-size: 15px; letter-spacing: .02em; margin: 18px 0 2px; }
  .frame > p { margin: 0 0 12px; color: var(--head-ink); font-size: 12.5px; }
  /* the real dialog, un-modal: same frame, same width, no backdrop */
  dialog.media-library__dialog.media-transfers__dialog[open] { position: static; margin: 0; max-height: none; }
  .uses-odd { color: var(--head-ink); }
  /* PROPOSED, not yet in components.css: the transfers dialog's bucket heading.
     Same numbers as `.media-library__group`, tuned for a 22px-padded dialog. */
  .media-transfers__group {
    color: var(--head-ink); font-size: 12px; text-transform: uppercase;
    letter-spacing: .07em; margin: 20px 0 2px;
  }
  .media-transfers__group:first-child { margin-top: 4px; }
</style>
</head>
<body>
<div class="bar" role="group" aria-label="Preview controls">
  <span class="group-label">Transfer labels</span>
  <button type="button" data-labels="friendly" aria-pressed="false">Today · Last week</button>
  <button type="button" data-labels="exact" aria-pressed="true">Last 24 hours · Last 7 days</button>
  <span class="spacer"></span>
  <span class="group-label">Data</span>
  <button type="button" data-data="fixtures" aria-pressed="true">Fixtures</button>
  <button type="button" data-data="real" aria-pressed="false">Real snapshot</button>
  <button type="button" id="theme">Dark</button>
</div>

<main class="stage2">
  <header class="read__head">
    <div class="read__head-top">
      <h1 class="read__title"><span>Media Library</span></h1>
    </div>
  </header>
  <div class="media-library" id="mediaLibrary">
    <p class="media-library__intro">Files available on this computer. Add a file while editing a Tata Ibadah entry, or choose one already in this library.</p>
    <div class="media-library__filters">
      <div class="media-library__chips" role="group" aria-label="File type filters">
        <button type="button" aria-pressed="false">Images</button>
        <button type="button" aria-pressed="false">Audio</button>
        <button type="button" aria-pressed="false">Video</button>
        <button type="button" aria-pressed="false">PDF</button>
        <button type="button" aria-pressed="false">Slides</button>
        <span aria-hidden="true">·</span>
        <button type="button" aria-pressed="false">Unused</button>
      </div>
      <p id="mediaResultCount"></p>
      <div class="media-library__sort">
        <button type="button" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5v13m0-13-2.5 2.5m2.5-2.5L8 6m6.5 10.5v-13m0 13-2.5-2.5m2.5 2.5L17 14"/></svg><span>Upload date · newest</span></button>
      </div>
    </div>
    <div id="mediaFileList"></div>
    <p class="media-library__empty" id="mediaEmpty" hidden></p>
  </div>

  <section class="frame" aria-labelledby="transfersFrameTitle">
    <h2 id="transfersFrameTitle">Transfers</h2>
    <p>The dialog, opened from the clock control on this page — the same frame and width, drawn un-modal here.</p>
    <dialog class="media-library__dialog media-transfers__dialog" open aria-label="Transfers">
      <h2>Transfers</h2>
      <div id="mediaTransfersList"></div>
    </dialog>
  </section>
</main>

  /* ---------- rows, as the real scripts build them ---------- */
  function fileRow(file) {
    var el = node('div', 'media-library__file' + (file.uses && !file.uses.length ? ' is-unused' : ''));
    var cell = node('div', 'media-library__file-icon'); cell.innerHTML = icon(file.family); el.appendChild(cell);
    var main = node('div', 'media-library__file-main');
    main.appendChild(node('div', 'media-library__filename', file.name));
    main.appendChild(node('div', 'media-library__meta', (FAMILY[file.family] || 'File') + ' · ' + longDate(file.uploaded_at) + ' · ' + fmtSize(file.size)));
    if (file.uses && file.uses.length) {
      var links = node('div', 'media-library__uses');
      file.uses.forEach(function (ref) {
        var line = node('div');
        var a = node('a', '', ref.service + ' (' + shortDate(ref.date + 'T05:00:00Z') + ')');
        a.appendChild(node('span', '', ' · ' + (ref.title || file.name)));
        a.href = ref.url;
        line.appendChild(a); links.appendChild(line);
      });
      main.appendChild(links);
    } else {
      main.appendChild(node('div', 'media-library__unused', file.uploaded_at === iso(41, 11, 5) ? 'Unused · Deletes in 11 days' : 'Unused · Deleted tomorrow'));
    }
    el.appendChild(main);
    var cloudControl = node('div', 'media-library__cloud');

      var available = node('span', 'media-library__cloud-available');

      available.setAttribute('role', 'img'); available.setAttribute('aria-label', 'Available online');

    row.append(mark, main);

  /* ---------- render ---------- */

  function render() {

    var transfers = document.documentElement.dataset.data === 'real' ? REAL_TRANSFERS : TRANSFER_FIXTURES;
    files = files.slice().sort(function (a, b) { return b.uploaded_at.localeCompare(a.uploaded_at); });
    document.getElementById('mediaResultCount').textContent = files.length + ' of ' + files.length + ' files shown';
    var list = document.getElementById('mediaFileList'); list.replaceChildren();
    var seen = null;

      return (b.ended_at || b.started_at).localeCompare(a.ended_at || a.started_at);
    });
    var last = null;
    if (!shown.length) host.appendChild(node('p', 'media-transfers__empty', 'No transfers yet.'));
    shown.forEach(function (transfer) {

      if (key !== last) {
        last = key;
        var head = node('h3', 'media-transfers__group', labels[key]);
        head.dataset.bucket = { today: 'last-24-hours', week: 'last-7-days', last30: 'last-30-days', year: 'earlier-this-year', older: 'older' }[key];
        host.appendChild(head);
      }
      host.appendChild(transferRow(transfer));
    });
  }

  document.querySelectorAll('[data-labels]').forEach(function (button) {
    button.addEventListener('click', function () {
      document.documentElement.dataset.labels = button.dataset.labels;
      document.querySelectorAll('[data-labels]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === button)); });
      render();
    });
  });
  document.querySelectorAll('[data-data]').forEach(function (button) {
    button.addEventListener('click', function () {
      document.documentElement.dataset.data = button.dataset.data;
      document.querySelectorAll('[data-data]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === button)); });
      render();
    });
  });
  document.getElementById('theme').addEventListener('click', function () {
    var dark = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    this.textContent = dark ? 'Light' : 'Dark';
  });
  render();
})();
</script>
</body>
</html>
