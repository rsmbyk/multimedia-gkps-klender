<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Old OBS source</title>
<style>
html, body { margin: 0; padding: 0; background: transparent; }
.retired {
  position: fixed; right: 16px; bottom: 16px;
  margin: 0;
  font: 500 12px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: rgba(255, 255, 255, .2);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
}
.retired a {
  display: none;
  margin-top: 2px;
  font-weight: 400;
  color: inherit;
  text-decoration: none;
}
.retired:hover {
  color: rgba(255, 255, 255, .95);
  text-shadow: none;
  background: rgba(20, 20, 18, .82);
  padding: 5px 9px;
  border-radius: 6px;
}
.retired:hover a { display: block; }
</style>
</head>
<body>
<div class="retired">Old OBS source<a href="/obs/source/overlay">Switch to /obs/source/overlay</a></div>
</body>
</html>
