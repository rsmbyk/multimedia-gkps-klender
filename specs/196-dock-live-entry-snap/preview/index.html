<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>196 preview — centre vs edge-snap</title>
<style>
:root {
  --rail-bg: #EDEAE3; --ink: #1F1F1D; --icon-hover-bg: rgba(31,31,29,.08);
  --sidebar-selected-bg: #B9D7C9; --divider: #D9D6CD; --head-ink: #646357;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body { font-family: var(--font-sans); margin: 0; background: #F7F5F1; color: var(--ink); }
.page { max-width: 880px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; margin: 0 0 8px; }
.sub { font-size: 13px; color: var(--head-ink); margin: 0 0 12px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.controls button {
  font: 500 12px/1 var(--font-sans); padding: 6px 10px; border: 1px solid var(--divider);
  background: #fff; border-radius: 6px; cursor: pointer; color: var(--ink);
}
.controls button[aria-pressed="true"] { background: var(--sidebar-selected-bg); border-color: var(--divider); }
.controls label { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
.panel { background: #fff; border: 1px solid var(--divider); border-radius: 9px; overflow: hidden; }
.panel__head { font: 650 11px/1 var(--font-sans); letter-spacing: .09em; text-transform: uppercase; color: var(--head-ink); padding: 8px 10px; border-bottom: 1px solid var(--divider); background: var(--rail-bg); }
.dock__body { height: 300px; overflow-y: auto; position: relative; padding: 4px 8px 10px; overscroll-behavior: contain; }
.dock__body ul { list-style: none; margin: 0; padding: 0; }
.entryli + .entryli { margin-top: 4px; }
.entryrow { display: flex; align-items: baseline; gap: 10px; width: 100%; min-height: 38px; padding: 9px 10px; border: 0; border-radius: 9px; background: none; color: var(--ink); font: 400 14.5px/1.35 var(--font-sans); text-align: left; cursor: pointer; }
.entryrow[aria-current="true"] { background: var(--sidebar-selected-bg); position: sticky; top: -4px; z-index: 3; }
.entryrow__c { flex: none; min-width: 2.1rem; font: 560 13px/1.4 var(--font-sans); }
.entryinner { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms cubic-bezier(.32,.72,.28,1); pointer-events: none; }
.entryinner.is-open { grid-template-rows: 1fr; pointer-events: auto; }
.entryinner__clip { overflow: hidden; min-height: 0; }
.entryinner__body { padding: 2px 8px 7px 2.75rem; }
.screenerow { display: block; width: 100%; margin: 0; padding: 5px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: 400 13px/1.45 var(--font-sans); text-align: left; cursor: pointer; }
.screenerow[aria-current="true"] { background: color-mix(in srgb, var(--sidebar-selected-bg) 45%, var(--icon-hover-bg)); }
.nextband { position: sticky; bottom: -10px; z-index: 3; display: flex; align-items: baseline; gap: 10px; width: 100%; margin: 6px 0 0; padding: 7px 10px 9px; border: 0; border-top: 1px solid var(--divider); background: var(--rail-bg); color: var(--ink); font: 400 13px/1.4 var(--font-sans); text-align: left; cursor: pointer; }
.nextband__cap { flex: none; min-width: 2.1rem; color: var(--head-ink); font: 650 10px/1.4 var(--font-sans); letter-spacing: .09em; text-transform: uppercase; }
.note { font-size: 12px; color: var(--head-ink); margin-top: 10px; }
.note code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--icon-hover-bg); padding: 1px 3px; border-radius: 4px; }
</style>
</head>
<body>
<div class="page">
  <h1>196 preview — centre vs edge-snap</h1>
  <p class="sub">Both panels hold the same list; only where they park the live entry differs. Pick a case, then press <strong>Re-settle</strong> (or press again to replay).</p>
  <div class="controls">
    <button data-scenario="off-top" aria-pressed="false">Entirely above top</button>
    <button data-scenario="off-bottom" aria-pressed="false">Entirely below bottom</button>
    <button data-scenario="partial" aria-pressed="true">Partly visible</button>
    <label><input type="checkbox" id="reduce"> Reduced motion (instant)</label>
  </div>
  <div class="row">
    <div class="panel">
      <div class="panel__head">Today — centre on sync</div>
      <div class="dock__body" id="bodyCentre"><ul></ul></div>
    </div>
    <div class="panel">
      <div class="panel__head">Proposed — edge snap</div>
      <div class="dock__body" id="bodySnap"><ul></ul></div>
    </div>
  </div>
  <p class="note" id="note"></p>
</div>
<script>
(function () {
  var liveIndex = 7; // entry 8 of 12
  var screens = ['Bait 1 line A', 'Bait 1 line B', 'Bait 2 line A', 'Bait 2 line B'];

  function build(body) {
    var ul = body.querySelector('ul');
    ul.textContent = '';
    for (var i = 0; i < 12; i++) {
      var li = document.createElement('li');
      li.className = 'entryli';
      li.dataset.index = String(i);
      var row = document.createElement('button');
      row.className = 'entryrow';
      row.type = 'button';
      row.tabIndex = -1;
      row.setAttribute('aria-current', i === liveIndex ? 'true' : 'false');
      var c = document.createElement('span'); c.className = 'entryrow__c'; c.textContent = String(i + 1);
      var t = document.createElement('span'); t.className = 'entryrow__t'; t.textContent = 'Entry ' + (i + 1);
      row.appendChild(c); row.appendChild(t);
      li.appendChild(row);
      if (i === liveIndex) {
        li.dataset.live = 'true';
        var inner = document.createElement('div'); inner.className = 'entryinner is-open';
        var clip = document.createElement('div'); clip.className = 'entryinner__clip';
        var innerBody = document.createElement('div'); innerBody.className = 'entryinner__body';
        for (var s = 0; s < 4; s++) {
          var sr = document.createElement('button'); sr.className = 'screenerow';
          sr.setAttribute('aria-current', s === 1 ? 'true' : 'false');
          sr.textContent = screens[s];
          innerBody.appendChild(sr);
        }
        clip.appendChild(innerBody); inner.appendChild(clip); li.appendChild(inner);
        var band = document.createElement('button'); band.className = 'nextband'; band.type = 'button';
        var cap = document.createElement('span'); cap.className = 'nextband__cap'; cap.textContent = 'Next';
        var lab = document.createElement('span'); lab.className = 'nextband__label'; lab.textContent = 'Entry 9';
        band.appendChild(cap); band.appendChild(lab); li.appendChild(band);
      } else {
        var closed = document.createElement('div'); closed.className = 'entryinner';
        var clip2 = document.createElement('div'); clip2.className = 'entryinner__clip';
        var innerBody2 = document.createElement('div'); innerBody2.className = 'entryinner__body';
        innerBody2.textContent = '(collapsed)';
        clip2.appendChild(innerBody2); closed.appendChild(clip2); li.appendChild(closed);
      }
      ul.appendChild(li);
    }
  }

  var centre = document.getElementById('bodyCentre');
  var snap = document.getElementById('bodySnap');
  build(centre); build(snap);

  function metrics(body) {
    var li = body.querySelector('.entryli[data-live="true"]');
    var row = li.querySelector('.entryrow');
    var band = li.querySelector('.nextband');
    return {
      top: li.offsetTop,
      height: li.offsetHeight,
      body: body.clientHeight,
      band: band ? band.offsetHeight : 0
    };
  }

  function target(body, m, scenario, snapMode) {
    var centre = m.top - (m.body - m.height) / 2;
    if (!snapMode || scenario === 'partial') return clamp(body, centre);
    if (scenario === 'off-top') return clamp(body, m.top + 4);
    // off-bottom: foot just above the band
    return clamp(body, m.top + m.height - (m.body - m.band - 4));
  }
  function clamp(body, t) {
    var max = body.scrollHeight - body.clientHeight;
    return Math.max(0, Math.min(t, max));
  }

  var current = 'partial';
  var reduce = document.getElementById('reduce');
  var note = document.getElementById('note');

  function initialScroll(m, scenario) {
    if (scenario === 'off-top') return m.top + m.body;       // scrolled far below
    if (scenario === 'off-bottom') return 0;                // scrolled to the top
    return m.top - m.body / 2;                             // centred (partial)
  }

  function settle(body, t) {
    if (reduce.checked) { body.scrollTop = t; return; }
    var from = body.scrollTop, start = null, dur = 190;
    function frame(now) {
      if (start === null) start = now;
      var p = Math.min(1, (now - start) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      body.scrollTop = from + (t - from) * e;
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function apply() {
    [['#bodyCentre', false], ['#bodySnap', true]].forEach(function (pair) {
      var body = document.querySelector(pair[0]);
      var m = metrics(body);
      body.scrollTop = initialScroll(m, current);
      // let the layout settle one frame, then glide
      requestAnimationFrame(function () {
        var m2 = metrics(body);
        settle(body, target(body, m2, current, pair[1]));
      });
    });
    note.innerHTML = 'Case: <code>' + current + '</code>. ' +
      (current === 'partial'
        ? 'Both panels centre — the entry is still partly in view.'
        : 'Left centres; right snaps to the edge (top flush, or foot just above the NEXT band).');
  }

  document.querySelectorAll('[data-scenario]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      current = btn.dataset.scenario;
      document.querySelectorAll('[data-scenario]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      apply();
    });
  });
  reduce.addEventListener('change', apply);
  apply();
})();
</script>
</body>
</html>
