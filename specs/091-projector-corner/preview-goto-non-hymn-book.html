<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projector Go To · non-hymn book label preview</title>
  <style>
    :root { color-scheme: dark; font-family: "CMG Sans", "Source Sans Pro", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #14130f; color: #f5f3ee; }
    .projector { position: relative; width: 100vw; height: 100dvh; overflow: hidden; background: #14130f; }
    .verse { position: absolute; inset: 32px 32px 64px; display: grid; place-items: center; }
    .verse__text { max-width: 1150px; font-size: clamp(50px, 8vw, 136px); font-weight: 700;
      line-height: 1.14; text-align: center; letter-spacing: -.025em; }
    .hud { position: absolute; left: 32px; right: 32px; bottom: 20px; height: 24px;
      display: flex; align-items: center; justify-content: space-between; color: #6e6a62;
      font-size: 16px; font-weight: 650; }
    .hud__icon { font-size: 20px; line-height: 1; margin-right: 12px; }
    .overlay { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
      border: 0; padding: 0; background: transparent; cursor: pointer; }
    .overlay[hidden], .goto[hidden] { display: none; }
    .goto { position: absolute; z-index: 2; left: 32px; bottom: 58px;
      width: min(400px, calc(100vw - 64px)); padding: 16px;
      background: #14130f; border: 1px solid #3a372f; border-radius: 10px;
      box-shadow: 0 16px 48px #0005; font-size: 11px; font-weight: 400; line-height: 1.45; }
    .goto__label { display: block; margin-bottom: 8px; color: #a29d93; }
    .goto__input { width: 100%; border: 1px solid #4a463f; border-radius: 5px;
      outline: 0; padding: 8px 10px; background: #2a2722; color: #f5f3ee; font: inherit; }
    .goto__input:focus-visible { border-color: #e8e4dc; }
    .goto__input::placeholder { color: #77736b; }
    .goto__result { display: flex; align-items: center; gap: 9px; width: 100%;
      margin-top: 6px; padding: 8px; border: 0; border-radius: 4px;
      background: #2a2722; color: #e8e4dc; text-align: left; font: inherit; cursor: pointer; }
    .goto__result:hover { background: #36322b; }
    .goto__result:disabled { opacity: .6; cursor: default; }
    .goto__suggestion { flex: 1; display: flex; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; }
    .goto__title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .goto__book { flex: none; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #6e6a62; }
    .goto__separator { flex: none; margin: 0 .4em; color: #6e6a62; }
    .goto__count { flex: none; color: #a29d93; }
    .goto__footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px;
      color: #8b867d; font-size: 10px; }
    .goto__footer kbd { font: inherit; color: #bcb7ae; }
    .opened { position: absolute; z-index: 3; right: 32px; top: 32px; max-width: min(400px, 70vw);
      padding: 10px 12px; border: 1px solid #3a372f; border-radius: 5px;
      background: #24221d; color: #bcb7ae; font-size: 11px; }
    .opened[hidden] { display: none; }
    .hint { position: absolute; top: 32px; right: 32px; max-width: 360px; color: #8e8a80; font-size: 11px; text-align: right; }
    @media (max-height: 480px) { .goto { bottom: 32px; } .verse__text { font-size: 44px; } }
  </style>
</head>
<body>
  <main class="projector">
    <div class="verse"><div class="verse__text">Tuhan adalah gembalaku, takkan kekurangan aku.</div></div>
    <div class="hud"><span><span class="hud__icon">☷</span> NKB 223A · 1/3 → Pengakuan dosa</span><span>⌨</span></div>
    <button type="button" class="overlay" id="overlay" aria-label="Close Go To"></button>
    <section class="goto" id="goto" aria-label="Go To passage or song">
      <label class="goto__label" for="query">Go To · Passage or Song</label>
      <input class="goto__input" id="query" autocomplete="off" spellcheck="false"
             placeholder="Try Kasih, 12, or NKB 2" aria-controls="suggestion">
      <button type="button" class="goto__result" id="suggestion" disabled>
        <span class="goto__suggestion" id="suggestionText">Start typing to find a match</span>
        <span class="goto__count" id="count">0 / 0</span>
      </button>
      <div class="goto__footer"><span><kbd>↑ ↓</kbd> cycle · <kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </section>
    <div class="opened" id="opened" hidden></div>
    <div class="hint">Press Down twice to inspect the long-title and long-book example. Each part clips independently; the result counter stays visible.</div>
  </main>
  <script>
    const songs = [
      {book: 'NKB', name: 'Nyanyikanlah Kidung Baru', number: 2, title: 'Hai Mari Sembah'},
      {book: 'KJ', name: 'Kidung Jemaat', number: 12, title: 'Anak Domba Allah'},
      ...Array.from({length: 10}, (_, i) => ({book: 'NKB', name: 'Nyanyikanlah Kidung Baru', number: 120 + i, title: 'Nyanyian ' + (120 + i)})),
      ...Array.from({length: 10}, (_, i) => ({book: 'NKB', name: 'Nyanyikanlah Kidung Baru', number: 20 + i, title: 'Nyanyian ' + (20 + i)})),
      ...Array.from({length: 30}, (_, i) => ({book: 'NKB', name: 'Nyanyikanlah Kidung Baru', number: 200 + i, title: 'Nyanyian ' + (200 + i)})),
      {book: 'NKB', name: 'Nyanyikanlah Kidung Baru', number: 223, sub: 'A', title: 'Haleluya'},
      {book: 'NKB', name: 'Nyanyikanlah Kidung Baru', number: 223, sub: 'B', title: 'Haleluya'},
      {book: 'KJ', name: 'Kidung Jemaat', number: 473, title: 'Haleluya'},
      {book: 'KJ', name: 'Kidung Jemaat', number: 312, title: 'Nyanyian 312'},
      {book: 'LSM', name: 'Lagu Sekolah Minggu', hymn: false, number: 14, title: 'Kasih Yesus Indah'},
      {book: 'PKA', name: 'Pujian Kaum Anak', hymn: false, number: 27, title: 'Kasih yang Tak Berkesudahan'},
      {book: 'LPR', name: 'Kumpulan Lagu Pujian Anak dan Remaja Gereja Sepanjang Tahun', hymn: false, number: 48, title: 'Kasih Tuhan yang Tak Berkesudahan Sepanjang Masa dan Segala Generasi'},
    ];
    const chapters = [2, 5, 20, 21, 22, 23, 24, 25, 26, 27, 28].map(number => ({
      book: 'Mat', name: 'Matius', number,
    }));
    let matches = [], selected = 0;
    const input = document.getElementById('query');
    const overlay = document.getElementById('overlay');
    const panel = document.getElementById('goto');
    const result = document.getElementById('suggestion');
    const suggestion = document.getElementById('suggestionText');
    const count = document.getElementById('count');
    const opened = document.getElementById('opened');
    const normalize = value => value.toLowerCase().trim().replace(/\s+/g, ' ');
    const label = item => item.name === 'Matius'
      ? `${item.name} ${item.number}`
      : item.hymn === false ? item.title : `${item.book} ${item.number}${item.sub || ''} ${item.title}`;

    function search(query) {
      const value = normalize(query);
      if (!value) return [];
      if (/^[0-9]+$/.test(value)) {
        return songs.filter(item => String(item.number).includes(value)).sort((a, b) => {
          const rank = item => String(item.number) === value ? 0
            : String(item.number).startsWith(value) ? 1 : 2;
          return rank(a) - rank(b) || a.number - b.number || a.book.localeCompare(b.book);
        });
      }
      const reference = value.match(/^(.+?)\s+(\d+)([a-z]?)$/);
      if (reference) {
        const book = normalize(reference[1]);
        const number = reference[2];
        const sub = reference[3].toUpperCase();
        const songMatches = songs.filter(item =>
          (normalize(item.book) === book || normalize(item.name) === book) &&
          String(item.number).startsWith(number) &&
          (!sub || (item.number == Number(number) && item.sub === sub)));
        const chapterMatches = chapters.filter(item =>
          (normalize(item.book) === book || normalize(item.name) === book) &&
          String(item.number).startsWith(number));
        return [...chapterMatches, ...songMatches].sort((a, b) =>
          Number(a.number !== Number(number)) - Number(b.number !== Number(number)) ||
          a.number - b.number || (a.sub || '').localeCompare(b.sub || ''));
      }
      const titleMatches = songs.filter(item => normalize(item.title).includes(value));
      if (!titleMatches.length) return [];
      const score = item => normalize(item.title) === value ? 0
        : normalize(item.title).startsWith(value) ? 1 : 2;
      const best = Math.min(...titleMatches.map(score));
      return titleMatches.filter(item => score(item) === best);
    }
    function paint() {
      result.disabled = !matches.length;
      suggestion.replaceChildren();
      if (matches.length) {
        const item = matches[selected];
        const title = document.createElement('span');
        title.className = 'goto__title';
        title.textContent = label(item);
        suggestion.append(title);
        if (item.hymn === false) {
          const dot = document.createElement('span');
          dot.className = 'goto__separator';
          dot.textContent = '·';
          const book = document.createElement('span');
          book.className = 'goto__book';
          book.textContent = item.name;
          suggestion.append(dot, book);
        }
      } else {
        suggestion.textContent = input.value.trim() ? 'No matching passage or song' : 'Start typing to find a match';
      }
      count.textContent = matches.length ? `${selected + 1} / ${matches.length}` : '0 / 0';
    }
    function close() { panel.hidden = true; overlay.hidden = true; input.blur(); }
    function open() { panel.hidden = false; overlay.hidden = false; input.focus(); }
    function choose() {
      if (!matches.length) return;
      opened.textContent = `Preview only · would open ${label(matches[selected])}`;
      opened.hidden = false;
      close();
    }
    input.addEventListener('input', () => { matches = search(input.value); selected = 0; paint(); });
    input.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (matches.length) selected = (selected + (event.key === 'ArrowDown' ? 1 : -1) + matches.length) % matches.length;
        paint();
      } else if (event.key === 'Enter') { event.preventDefault(); choose(); }
      else if (event.key === 'Escape') { event.preventDefault(); close(); }
    });
    result.addEventListener('click', choose);
    overlay.addEventListener('click', close);
    document.addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'g' && panel.hidden && !event.ctrlKey && !event.metaKey) {
        event.preventDefault(); open();
      }
    });
    input.value = 'Kasih'; matches = search('Kasih'); paint(); input.focus();
  </script>
</body>
</html>
