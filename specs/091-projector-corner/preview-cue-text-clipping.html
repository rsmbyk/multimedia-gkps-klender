<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adjacent untitled Text cues · preview</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #14130f; color: #e8e4dc; font: 400 14px/1.4 "CMG Sans", "Source Sans Pro", sans-serif; }
.stage { position: relative; width: 100%; height: 340px; background: #1b1a17; }
.words { position: absolute; inset: 30px 32px 64px; display: grid; place-items: center; color: #f5f3ee; font-size: clamp(30px, 5vw, 72px); font-weight: 700; text-align: center; }
.cue { position: absolute; left: 32px; right: 84px; bottom: 20px; display: flex; align-items: center; height: 24px; color: #6e6a62; font-size: 16px; font-weight: 650; white-space: nowrap; }
.icon, .separator, .progress, .next-arrow { flex: none; }
.icon { font-size: 20px; font-weight: 400; }
.separator { margin: 0 .42em 0 .32em; }
.prefix, .next { display: inline-flex; align-items: center; min-width: 0; height: 24px; }
.prefix, .next { flex: 0 1 auto; }
.source { display: block; min-width: 0; max-width: min(50ch, 32vw); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prefix .source { font-style: italic; }
.progress { color: #e8e4dc; margin-left: .35em; }
.next { margin-left: .3em; gap: .2em; }
.next-arrow { width: 16px; height: 16px; }
.keyboard { position: absolute; right: 32px; bottom: 20px; color: #6e6a62; font-size: 18px; }
.explain { padding: 24px 32px; color: #a29d93; font-size: 13px; }
.explain b { color: #e8e4dc; }
</style>
</head>
<body>
<div class="stage">
  <div class="words">Marilah kita bangkit berdiri!</div>
  <div class="cue">
    <span class="icon">☷</span><span class="separator">·</span>
    <span class="prefix"><i class="source" id="current"></i></span>
    <span class="progress">· 1/1</span>
    <span class="next"><svg class="next-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 8h12m-4-4 4 4-4 4"/></svg><span class="source" id="following"></span></span>
  </div>
  <span class="keyboard">⌨</span>
</div>
<p class="explain"><b>Adjacent untitled Text entries:</b> each first-line label is capped at 50 characters plus an ellipsis. Both labels can shrink further within the available HUD width. The count, arrow, and keyboard button keep their space; the service list retains full labels.</p>
<script>
  const labels = {
    current: 'L : Marilah kita bangkit berdiri! Di dalam nama Allah Bapa, dan Tuhan Yesus Kristus, serta Roh Kudus, Pencipta langit dan bumi.',
    following: 'L : Marilah kita bangkit berdiri! Di dalam nama Allah Bapa, dan Tuhan Yesus Kristus, serta Roh Kudus, Pencipta langit dan bumi.'
  };
  for (const [id, full] of Object.entries(labels)) {
    const node = document.getElementById(id);
    const chars = Array.from(full);
    node.textContent = chars.length > 50 ? chars.slice(0, 50).join('') + '…' : full;
    node.title = full;
  }
</script>
</body>
</html>
