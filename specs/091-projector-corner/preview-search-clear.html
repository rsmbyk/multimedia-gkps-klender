<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projector search clear controls · preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 48px 32px; background: #14130f; color: #e8e4dc; font: 400 11px/1.4 "CMG Sans", "Source Sans Pro", sans-serif; }
  .wrap { display: flex; align-items: flex-start; gap: 40px; flex-wrap: wrap; }
  .panel { width: min(400px, calc(100vw - 64px)); padding: 16px; border: 1px solid #3a372f; border-radius: 10px; background: #14130f; box-shadow: 0 16px 48px #0005; }
  .panel--service { width: min(360px, calc(100vw - 64px)); }
  label { display: block; margin-bottom: 8px; color: #8e8a80; }
  .field { position: relative; }
  input { width: 100%; padding: 8px 42px 8px 10px; border: 1px solid #4a463f; border-radius: 5px; outline: 0; background: #2a2722; color: #e8e4dc; font: inherit; }
  input:focus-visible { border-color: #e8e4dc; }
  input::-webkit-search-cancel-button { display: none; }
  .clear { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); width: 26px; height: 26px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 50%; background: none; color: #8e8a80; cursor: pointer; }
  .clear svg { width: 14px; height: 14px; }
  .clear:hover { background: #36322b; color: #e8e4dc; }
  .clear:focus-visible { outline: 2px solid #e8e4dc; outline-offset: 1px; }
  .clear[hidden] { display: none; }
  .row { display: flex; justify-content: space-between; gap: 9px; margin-top: 6px; padding: 8px; border-radius: 4px; background: #2a2722; }
  .count { color: #8e8a80; }
  .entry { padding: 9px 0; border-bottom: 1px solid #24221d; }
  .note { margin: 30px 0 0; color: #8e8a80; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <section class="panel panel--service">
    <label for="service">SERVICE ENTRIES</label>
    <div class="field"><input id="service" type="search" value="pengakuan" placeholder="Search entries"><button class="clear" type="button" aria-label="Clear service search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg></button></div>
    <div class="entry">Pengakuan dosa</div><div class="entry">Doa pengakuan</div>
  </section>
  <section class="panel">
    <label for="goto">Go To · Passage or Song</label>
    <div class="field"><input id="goto" type="search" value="NKB 223" placeholder="Try NKB 2, Matius 2, or Haleluya"><button class="clear" type="button" aria-label="Clear Go To search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg></button></div>
    <div class="row"><span>NKB 223A Haleluya</span><span class="count">1 / 2</span></div>
  </section>
</div>
<p class="note">Type or click × to compare the filled and empty states. Clearing keeps focus in the field.</p>
<script>
  document.querySelectorAll('.field').forEach(field => {
    const input = field.querySelector('input'), clear = field.querySelector('button');
    const sync = () => { clear.hidden = !input.value; };
    clear.addEventListener('click', () => { input.value = ''; input.dispatchEvent(new Event('input', {bubbles: true})); input.focus(); });
    input.addEventListener('input', sync); sync();
  });
</script>
</body>
</html>
