<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse reference notice — preview</title>
<style>
/*
 * Design tokens — Multimedia GKPS Klender
 *
 * Values pinned by spec 004 (the accepted mockup): a warm paper canvas, a
 * tinted rail surface, and two state accents — GKPS forest green in light
 * mode, lifted royal blue in dark. Contrast is not a preference here:
 * tests/test_design_tokens.py asserts every listed pair meets WCAG AA in
 * both modes, so edit palette values only with that suite in reach.
 *
 * Layout widths are the accepted mockup's metrics; the state-derived width
 * rules (open / mini / song-list modes) live in components.css.
 */

:root {
  --rail-w: 80px;              /* matches the reference rail */
  --logo: 40px;
  --btn: 44px;                 /* hit target, larger than the artwork */
  --r-btn: 8px;

  /* light */
  --canvas: #F7F5F1;
  --rail-bg: #EDEAE3;
  --ink: #1F1F1D;
  --icon: #222220;
  --icon-hover-bg: rgba(31, 31, 29, .08);
  --active-bg: #1C5C3C;        /* GKPS forest green in place of the reference red */
  --active-ink: #FFFFFF;
  --sidebar-selected-bg: #B9D7C9; /* selected rows only; keep action accents */
  --divider: #D9D6CD;
  --scroll-thumb: #B4B0A6;
  --scroll-thumb-hover: #948F85;
  --tip-bg: #1F1F1D;
  --tip-ink: #FFFFFF;
  --head-ink: #646357;           /* group headers + meta on canvas */
  --danger: #B3261E;             /* destructive actions, invalid fields */
  --link: #1C5C3C;               /* link colour: media library "used by" links */
  /* liturgy voices (spec 059): quieter than --ink, leader quietest */
  --speaker-join: #2B5A64;
  --speaker-leader: #866B50;
  --focus: #1C5C3C;
  --active-flash: rgba(28, 92, 60, .16);
  --shadow: 0 6px 18px -10px rgba(20,20,18,.5);
  /* A modal has to read as a sheet lifted off the page, not as a slightly-grey
     panel sitting in it (spec 086): a deep scrim behind, its own lift, a hairline edge. */
  --backdrop: rgba(20, 20, 18, .52);
  --shadow-dialog: 0 18px 48px -20px rgba(20, 20, 18, .55), 0 2px 8px -4px rgba(20, 20, 18, .3);

  --ease: 200ms cubic-bezier(.32, .72, .28, 1);
  /* The same curve WITHOUT the duration. `--ease` is a whole shorthand value on purpose --
     most rules write `transition: color var(--ease)` and want the duration with it -- but a
     rule that names its own duration must use this one: two time values in a transition or
     animation shorthand are duration and DELAY, so `transition: transform 60ms var(--ease)`
     waited 200ms before every morph, and no amount of shortening the duration could be felt. */
  --ease-timing: cubic-bezier(.32, .72, .28, 1);
  --nav-w: 18.5rem;                /* books panel, expanded: widest row
                                      (Kisah Para Rasul / Lahoan Ni Apostel)
                                      measures 281px incl. chrome */
  --mini-w: var(--rail-w);         /* collapsed panel mirrors the main rail */
  --ch-w: var(--rail-w);           /* chapters rail: always rail-width, like mini */
  /* song list: a full-width panel beside the books, not a tile rail (there is
     nothing to abbreviate a song to). The books panel clamps against a STATIC
     reserve so panel-w -> reserve-ch, sp-w -> panel-w stays a one-way chain. */
  --songsp-w: min(26rem, calc(100vw - var(--rail-w) - var(--books-w) - 20rem));
  --songlist-reserve: 18rem;
  --pad-top: 40px;                 /* page top padding; verses echo it at the bottom */

  /* tooltip starts 10px outside the RAIL edge: half the gap between rail and
     button widths, plus the gap. Recalculates when the rail narrows at 560px. */
  --tip-x: calc((var(--rail-w) - var(--btn)) / 2 + 10px);

  /* resolved width of the nested panel; shared by its clip-wiped box and
     the stage/second-column layout. Reserve chapter space only while open. */
  --reserve-ch: 0px;
  --panel-w: min(var(--nav-w), calc(100vw - var(--rail-w) - var(--reserve-ch) - 2rem));

  /* live widths of the two nested columns; 0 while hidden. The stage margin
     and the chapters rail's left both derive from these, so everything
     pushes/pulls in one coordinated motion. */
  --books-w: 0px;
  --ch-w-shown: 0px;

    /* Type */
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-serif: ui-serif, Georgia, 'Times New Roman', serif;
}

:root[data-theme="dark"] {
  --canvas: #14130F;
  --rail-bg: #232019;
  --ink: #F5F3EE;
  --icon: #E8E6E0;
  --icon-hover-bg: rgba(255, 255, 255, .09);
  --active-bg: #7C9CF0;         /* GKPS royal blue (#143792), lifted for dark surfaces */
  --active-ink: #0D1838;
  --sidebar-selected-bg: #393F4F;
  --active-flash: rgba(124, 156, 240, .22);
  --divider: #3A362F;
  --scroll-thumb: #45413A;
  --scroll-thumb-hover: #65615A;
  --tip-bg: #EDEBE5;
  --tip-ink: #16150F;
  --head-ink: #9C9A91;
  --danger: #FF9E9A;            /* lifted for dark surfaces */
  --link: #7C9CF0;              /* link colour: media library "used by" links */
  --speaker-join: #8EC2CC;      /* liturgy voices (spec 059), also the projector's */
  --speaker-leader: #9C8463;
  --focus: #7C9CF0;
  --shadow: 0 6px 18px -10px rgba(0,0,0,.9);
  /* A modal has to read as a sheet lifted off the page, not as a slightly-grey
     panel sitting in it (spec 086): a deep scrim behind, its own lift, a hairline edge. */
  --backdrop: rgba(0, 0, 0, .68);
  --shadow-dialog: 0 20px 52px -22px rgba(0, 0, 0, .9), 0 2px 8px -4px rgba(0, 0, 0, .7);
}

@media (max-width: 560px) {
    :root { --rail-w: 64px; --btn: 40px; --logo: 34px;}
}

.editor {
  /* fixed, not relative: a relative dialog is laid out in the document's own
     coordinates, so a scrolled page shifted it up by the scroll offset — a
     760px frame opened from a long service started above the viewport's top
     edge. Both are positioned, so absolutely-placed children still resolve. */
  position: fixed; width: min(30rem, calc(100vw - 32px));
  padding: 0; border: 0; border-radius: 14px;
  background: var(--canvas); color: var(--ink);
  /* the hairline is drawn with a shadow, not a border: a border would take two pixels
     off the dialog's own width and shift every measurement inside it */
  box-shadow: 0 0 0 1px var(--divider), var(--shadow-dialog);
  display: flex; flex-direction: column;
  max-height: min(86vh, 46rem);
}
/* An author display rule beats the UA's rule for a CLOSED dialog, so the dialog
   has to say it again for itself -- otherwise it lays out inside the page and
   steals width from the reading column. */
.editor:not([open]) { display: none; }
.editor::backdrop { background: var(--backdrop); }
/* The scroll belongs in here, not on the page behind: a dialog taller than the
   viewport scrolls the document it sits over, which is the scrollbar everybody
   notices and nobody wants. */
.editor__content { padding: 22px; overflow-y: auto; min-height: 0; }
.editor:has([data-editor-size="large"]) { width: min(840px, calc(100vw - 32px)); height: min(760px, calc(100dvh - 32px)); max-height: min(760px, calc(100dvh - 32px)); }
.editor[open]:has([data-entry-form="media"]) { animation: media-library-in 190ms cubic-bezier(.2,.8,.2,1) both; }
.editor[open].media-closing:has([data-entry-form="media"]) { animation: media-library-out 150ms ease-in both; }
.editor:has([data-editor-size="large"]) .editor__content { padding: 0; overflow: hidden; display: flex; flex-direction: column; flex: 1; }
.editor:has([data-editor-size="large"]) .editor__body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
/* The header row carries the inset and the one divider. The title's own padding and
   border were moved here: the large selector (0,3,0) outranks `.editor__head .editor__title`
   (0,2,0), so leaving them on the title drew a second rule 37.5px above this one. */
.editor:has([data-editor-size="large"]) .editor__head { padding: 20px 26px 14px; }
.editor:has([data-editor-size="large"]) .editor__title { margin: 0; padding: 0; border: 0; font-size: 21px; }
.editor:has([data-editor-size="large"]) .editor__form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.editor:has([data-editor-size="large"]) .editor__form > .editor__field,
.editor:has([data-editor-size="large"]) .editor__screen-mode-wrap { margin: 14px 26px 0; }
.editor:has([data-editor-size="large"]) .editor__actions { margin: 14px 26px 20px; border: 0; padding: 0; }
/* the one field that takes the leftover height: the text box is the modal's subject,
   so it grows instead of leaving the tall frame with a fixed six-row hole in it */
.editor:has([data-editor-size="large"]) [data-editor-grow] { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.editor:has([data-editor-size="large"]) [data-editor-grow] textarea { flex: 1; min-height: 0; }
@media (max-width: 650px) { .editor:has([data-editor-size="large"]) .editor__title { padding: 16px 18px; } .media-entry__panel { padding: 0 18px; } .editor:has([data-editor-size="large"]) .editor__form > .editor__field, .editor:has([data-editor-size="large"]) .editor__screen-mode-wrap { margin-inline: 18px; } .editor:has([data-editor-size="large"]) .editor__actions { margin-inline: 18px; } }
.editor__head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin: 0 0 16px; padding: 0 0 14px; border-bottom: 1px solid var(--divider);
}
.editor__head .editor__title { margin: 0; padding: 0; border: 0; }
.editor__copy-btn {
  flex: none; height: 34px; padding: 0 13px; border: 1px solid var(--divider); border-radius: 8px;
  background: none; color: var(--ink); cursor: pointer;
  font: 560 13px/1 ui-sans-serif, system-ui, sans-serif;
}
.editor__copy-btn:hover { border-color: var(--focus); background: var(--icon-hover-bg); }
.editor__copy-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.editor__title {
  margin: 0 0 16px; padding: 0 34px 14px 0;
  font-size: 18px; font-weight: 640; letter-spacing: -.01em;
  border-bottom: 1px solid var(--divider);
}
.editor__loading-title {
  margin: 0 0 8px; padding: 0; border: 0;
  font-size: 20px; line-height: 1.25;
}
.editor__loading {
  display: flex; min-height: 80px; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px;
  color: var(--head-ink); text-align: center;
  font: 400 14px/1.4 ui-sans-serif, system-ui, sans-serif;
}
.editor__loading-spinner {
  box-sizing: border-box; flex: 0 0 18px;
  width: 18px; height: 18px;
  border: 2px solid var(--divider); border-top-color: var(--active-bg);
  border-radius: 50%; animation: editor-load-spin 800ms linear infinite;
}
.editor__loading-label { font: inherit; }
@keyframes editor-load-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .editor__loading-spinner { animation: none; }
}
/* The dialog carries no x: the form's own Cancel, Escape and the backdrop are the
   ways out, and chrome that repeats a control the form already has is noise. */
.editor__field { margin: 0 0 12px; }
/* The passage translation switch gets its own centered row above Book. */
.editor__translation-row { display: flex; justify-content: center; margin: 0 0 8px; }
.read__lang.editor__translation-toggle { margin: 0; }
/* A field's label is a <label> when it names one control and a .editor__label when it
   names a group (the fill-in's kind, spec 167): both read the same. */
.editor__field > label,
.editor__field > .editor__label {
  display: block; margin-bottom: 5px;
  font: 560 12.5px/1.3 ui-sans-serif, system-ui, sans-serif; color: var(--head-ink);
}
.editor__field input[type="text"], .editor__field input[type="number"],
.editor__field input[type="search"],
.editor__field input[type="date"], .editor__field select, .editor__field textarea {
  width: 100%; min-height: 38px; padding: 8px 10px;
  border: 1px solid var(--divider); border-radius: 9px;
  background: var(--rail-bg); color: var(--ink);
  font: 500 14px/1.35 ui-sans-serif, system-ui, sans-serif;
}
.editor__field textarea { resize: none; }
.editor__help { margin: 5px 0 0; font-size: 12px; color: var(--head-ink); }
.editor__error { margin: 5px 0 0; font-size: 12.5px; font-weight: 600; color: var(--danger); }
.editor__actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--divider);
}
.editor__save, .editor__cancel, .editor__danger {
  height: 38px; padding: 0 18px; border-radius: 9px;
  font: 600 13.5px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer;
}
.editor__save { border: 0; background: var(--active-bg); color: var(--active-ink); }
.editor__cancel { border: 1px solid var(--divider); background: none; color: var(--ink); }
/* The destructive answer is the same button as the others, in the danger colour:
   a confirmation whose two answers are different sizes reads as a mistake. */
.editor__danger { border: 1px solid var(--danger); background: none; color: var(--danger); }
.editor__danger:not(:disabled):hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.editor__save:focus-visible, .editor__cancel:focus-visible, .editor__danger:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
.editor__save:disabled { background: var(--divider); color: var(--head-ink); cursor: not-allowed; }
.editor__cancel:disabled, .editor__danger:disabled {
  opacity: .5; cursor: not-allowed;
}

/* A hint rides inside a label without shouting: "(optional)", "all verses". */
.editor__hint { font-weight: 400; color: var(--head-ink); }

/* ---- preview chrome (not part of the product) ---- */
html, body { margin: 0; min-height: 100%; }
body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
.stage {
  position: relative; min-height: calc(100vh - 150px); display: flex;
  align-items: center; justify-content: center; padding: 90px 16px 70px;
  background: color-mix(in srgb, var(--canvas) 62%, var(--backdrop));
}
.editor { top: auto !important; left: auto !important; margin: 0 !important; }
.toolbar, .readout {
  position: fixed; left: 0; right: 0; z-index: 10; display: flex; gap: 8px;
  align-items: center; flex-wrap: wrap; padding: 10px 16px;
  background: var(--rail-bg); border-bottom: 1px solid var(--divider);
  color: var(--ink); font: 500 12px/1.3 var(--font-sans);
}
.toolbar { top: 0; }
.readout { bottom: 0; border-bottom: 0; border-top: 1px solid var(--divider); font-family: ui-monospace, monospace; color: var(--head-ink); }
.toolbar strong { font-weight: 700; margin-right: 4px; }
.toolbar button {
  height: 30px; padding: 0 11px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--divider); background: var(--canvas); color: var(--ink);
  font: 600 12px/1 var(--font-sans);
}
.toolbar button.on { background: var(--active-bg); border-color: var(--active-bg); color: var(--active-ink); }
.toolbar .sep { width: 1px; height: 22px; background: var(--divider); margin: 0 4px; }

/* ---- the proposed notices ---- */
.ref-note svg { flex: none; }
.variant-current .ref-note { margin: 5px 0 0; }

/* A — neutral callout between the field and the actions */
.variant-a .ref-note {
  margin: 12px 26px 0; padding: 11px 12px; display: flex; gap: 10px; align-items: flex-start;
  border: 1px solid var(--divider); border-radius: 9px; background: var(--rail-bg);
  font: 400 12px/18px var(--font-sans); color: var(--head-ink);
}
.variant-a .ref-note svg { width: 18px; height: 18px; margin-top: 1px; color: var(--head-ink); }
.variant-a .ref-note strong { display: block; font: 600 13px/1.35 var(--font-sans); color: var(--ink); }
.variant-a .ref-note span { display: block; margin-top: 2px; font: 400 12px/18px var(--font-sans); color: var(--head-ink); }
.variant-a .editor__actions { margin-top: 10px; }

/* B — one line in the action row, left of the buttons; button reads neutral */
.variant-b .editor__actions { display: flex; align-items: center; justify-content: flex-start; }
.variant-b .ref-note {
  margin-right: auto; display: flex; align-items: center; gap: 7px;
  font: 400 12px/18px var(--font-sans); color: var(--head-ink);
}
.variant-b .ref-note svg { width: 15px; height: 15px; color: var(--head-ink); }
.variant-b .ref-note b { font-weight: 700; color: var(--ink); }
.variant-b .editor__danger:disabled {
  opacity: 1; background: var(--rail-bg); border-color: var(--divider); color: var(--head-ink);
}
@media (max-width: 650px) {
  .variant-b .editor__actions { flex-wrap: wrap; row-gap: 10px; }
  .variant-b .ref-note { flex: 1 0 100%; margin-right: 0; }
  .variant-b .editor__actions > button:first-of-type { margin-left: auto; }
}

/* C — banner under the header, danger-tinted; neutral button */
.variant-c .ref-note {
  margin: 12px 26px 0; padding: 10px 12px; display: flex; gap: 10px; align-items: center;
  border: 1px solid color-mix(in srgb, var(--danger) 26%, var(--divider));
  border-left: 3px solid var(--danger); border-radius: 8px;
  background: color-mix(in srgb, var(--danger) 7%, var(--canvas));
  font: 500 12.5px/1.4 var(--font-sans); color: var(--ink);
}
.variant-c .ref-note svg { width: 17px; height: 17px; color: var(--danger); }
.variant-c .editor__danger:disabled {
  opacity: 1; background: var(--rail-bg); border-color: var(--divider); color: var(--head-ink);
}
</style>
</head>
<body class="variant-current">

<div class="toolbar">
  <strong>Notice</strong>
  <button data-variant="current" class="on">Current</button>
  <button data-variant="a">A · Callout</button>
  <button data-variant="b">B · Inline</button>
  <button data-variant="c">C · Banner</button>
  <span class="sep"></span>
  <strong>Used in</strong>
  <button data-count="1" class="on">1</button>
  <button data-count="3">3</button>
  <span class="sep"></span>
  <button data-theme="light" class="on">Light</button>
  <button data-theme="dark">Dark</button>
</div>

<dialog class="editor" open>
  <div class="editor__content">
    <div class="editor__body" data-kind="verse" data-target="42">
      <div class="editor__head">
        <h2 class="editor__title" id="editorTitle">Edit verse 3</h2>
      </div>
      <form class="editor__form" data-editor-size="large" onsubmit="return false">
        <div class="editor__field" data-editor-grow>
          <label for="verseLyric">Lyrics</label>
          <textarea id="verseLyric" name="lyric">O Tuhan, ENGKAU yang kekal
Di surga dan di bumi
Kasih-Mu yang tidak berkesudahan
Kami puji nama-Mu</textarea>
        </div>
        <div class="editor__actions">
          <button class="editor__danger editor__delete" type="button" data-verse-delete disabled>Delete verse</button>
          <button class="editor__save" type="submit">Save</button>
          <button class="editor__cancel" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</dialog>

<div class="readout" id="readout">measuring…</div>

<script>
(function () {
  var body = document.body;
  var form = document.querySelector('.editor__form');
  var actions = document.querySelector('.editor__actions');
  var head = document.querySelector('.editor__head');
  var field = document.querySelector('[data-editor-grow]');
  var note = null;
  var current = 'current';
  var count = 1;

  var icons = {
    info: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.4"/><path d="M10 9v4.4M10 6.5v.2"/></svg>',
    lock: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.4" y="8.6" width="11.2" height="8" rx="1.8"/><path d="M7 8.6V6.4a3 3 0 0 1 6 0v2.2"/></svg>',
    warn: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.8 18 16.6H2z"/><path d="M10 8v3.4M10 13.8v.2"/></svg>'
  };
  function noun(n) { return n + ' Tata Ibadah'; }

  function buildNote() {
    if (note) note.remove();
    note = document.createElement('div');
    note.className = current === 'current' ? 'ref-note editor__help' : 'ref-note';
    note.setAttribute('role', 'note');
    if (current === 'current') {
      note.innerHTML = 'This verse is used in ' + noun(count) + ', so it cannot be deleted here.';
      form.appendChild(note);
    } else if (current === 'a') {
      note.innerHTML = icons.info + '<div><strong>Delete unavailable</strong><span>Used in ' + noun(count) + '.</span></div>';
      form.insertBefore(note, actions);
    } else if (current === 'b') {
      note.innerHTML = icons.lock + '<span>Used in <b>' + count + '</b> Tata Ibadah — delete unavailable</span>';
      /* the note is the first flex child of the action row, buttons stay right */
      actions.insertBefore(note, actions.firstChild);
    } else {
      note.innerHTML = icons.warn + '<span>This verse is named in ' + noun(count) + '. It cannot be deleted until it is removed there.</span>';
      form.insertBefore(note, field);
    }
  }

  function measure() {
    var out = [];
    function box(label, el) {
      if (!el) return;
      var r = el.getBoundingClientRect(), s = getComputedStyle(el);
      out.push(label + ' ' + Math.round(r.width) + '×' + Math.round(r.height) +
        ' @ y' + Math.round(r.top) + ' | font ' + s.fontSize + '/' + s.lineHeight +
        ' | bg ' + s.backgroundColor + ' | ink ' + s.color);
    }
    box('note', note);
    box('delete', document.querySelector('[data-verse-delete]'));
    var s = getComputedStyle(document.querySelector('[data-verse-delete]'));
    out.push('delete opacity ' + s.opacity + ' border ' + s.borderColor);
    var d = document.querySelector('.editor').getBoundingClientRect();
    out.push('dialog ' + Math.round(d.width) + '×' + Math.round(d.height));
    document.getElementById('readout').textContent = out.join('   ·   ');
  }

  function render() {
    body.className = 'variant-' + current + (document.documentElement.dataset.theme === 'dark' ? ' is-dark' : '');
    buildNote();
    measure();
  }

  document.querySelectorAll('[data-variant]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-variant]').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on'); current = btn.dataset.variant; render();
    });
  });
  document.querySelectorAll('[data-count]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('[data-count]').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on'); count = Number(btn.dataset.count); render();
    });
  });
  document.querySelectorAll('[data-theme]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.documentElement.dataset.theme = btn.dataset.theme;
      document.querySelectorAll('[data-theme]').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on'); render();
    });
  });
  render();
})();
