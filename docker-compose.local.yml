services:
  web:
    environment:
      DATABASE_URL: postgresql://multimedia:multimedia@db:5432/multimedia
      DJANGO_DEBUG: "True"
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multimedia
      POSTGRES_USER: multimedia
      POSTGRES_PASSWORD: multimedia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multimedia -d multimedia"]
      interval: 5s
      timeout: 5s
      retries: 5
