<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The faces the worship decks are set in, and what this image draws instead.

  A deck converted without these answers lands on whatever family fontconfig picks next — in this
  image that used to be Liberation Mono, so every proportional run re-wrapped and the slide reflowed.
  Each alias below is a metric-compatible substitute where one exists (Carlito for Calibri, Caladea
  for Cambria, Liberation for Arial and Times New Roman) and a proportional substitute where none
  does (the two Office display faces), never a monospaced one.

  Read back by `python -m multimedia.slide_fonts`, which the build runs and which fails it.
-->
<fontconfig>
  <description>GKPS slides — the mapping the deck converter relies on</description>

  <!--
    Search order decides a same-family clash: the operator's own file wins over a copy installed on
    the computer, which in turn wins over the substitutes below. The generic families stay bound
    "same" — a generic is never a family the computer has, and a weak alias is ignored for them.
  -->
  <dir>/usr/share/fonts/operator</dir>
  <dir>/usr/share/fonts/host</dir>

  <!-- Metric-compatible with Calibri, including Calibri Light, which a deck reaches through its theme. -->
  <alias binding="weak">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Calibri Light</family>
    <prefer><family>Carlito</family></prefer>
  </alias>

  <!-- Metric-compatible with Cambria. -->
  <alias binding="weak">
    <family>Cambria</family>
    <prefer><family>Caladea</family></prefer>
  </alias>

  <!-- Metric-compatible with the Arial family, which the decks use for their tables. -->
  <alias binding="weak">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Helvetica</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Arial Narrow</family>
    <prefer><family>Liberation Sans Narrow</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>

  <!--
    Office display faces with no free metric equivalent: Britannic Bold sets the cover titles and the
    thank-offering paragraph, Berlin Sans FB Demi the first slide's title. Until the operator mounts
    them (GKPS_FONTS_DIR), a proportional bold is the closest honest answer.
  -->
  <alias binding="weak">
    <family>Britannic Bold</family>
    <prefer><family>Noto Sans</family><family>Carlito</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Berlin Sans FB Demi</family>
    <prefer><family>Noto Sans</family><family>Carlito</family></prefer>
  </alias>

  <!-- A generic request stays proportional. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>Carlito</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>Caladea</family></prefer>
  </alias>
</fontconfig>
