[pytest]
DJANGO_SETTINGS_MODULE = multimedia.settings_test
python_files = tests.py test_*.py *_tests.py
testpaths =
    multimedia
    tests
addopts =
    --strict-markers
    --cov=multimedia
    --cov-report=term-missing
    --cov-report=xml:coverage-python.xml
    --cov-config=.coveragerc
markers =
    unit: fast tests with no external services
    integration: tests that hit the database or HTTP stack
filterwarnings =
    ignore::DeprecationWarning

