{% for song in songs %}
<li><a class="songrow" href="{% url 'web-song' song.id %}" data-i="{{ song.id }}"
       data-t="{{ song.sort_title }}" data-o="{{ forloop.counter0 }}" data-m="{{ song.modified_key }}"
       {% if song.number_display %}data-num="{{ song.number_display }}" {% endif %}{% if song.current %} aria-current="true"{% endif %}>
  {% if song.number_display %}<span class="songrow__c">{{ song.number_display }}</span>{% endif %}
  <span class="songrow__t">{{ song.title }}</span></a>{% if editor_enabled and not book_is_hymn %}
    <button class="row-edit" type="button" data-editor-open="song" data-editor-id="{{ song.id }}"
            aria-label="Edit {{ song.title }}">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12.5 4.5l3 3-8 8H4.5v-3z"/></svg>
    </button>
    <button class="row-delete" type="button" data-editor-delete="song" data-editor-id="{{ song.id }}"
            aria-label="Delete {{ song.title }}">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.5 6h11M8 6V4.5c0-.8.7-1.5 1.5-1.5h1c.8 0 1.5.7 1.5 1.5V6M6.2 6l.6 9.2c.1.7.7 1.3 1.4 1.3h3.6c.7 0 1.3-.6 1.4-1.3l.6-9.2"/></svg>
    </button>{% endif %}</li>
{% endfor %}
