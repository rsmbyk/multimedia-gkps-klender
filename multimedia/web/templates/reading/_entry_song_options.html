{% comment %}The song pick's options, grouped by songbook (spec 006, slice 2).{% endcomment %}
{% for group in groups %}
<div class="editor__songgroup">
  <p class="editor__songgroup-label">{{ group.name }}</p>
  {% for song in group.songs %}
  <button type="button" class="editor__songoption" data-song="{{ song.id }}"
          data-song-title="{{ song.title }}">
    {% if song.number %}{{ song.number }} — {% endif %}{{ song.title }}
  </button>
  {% endfor %}
</div>
{% empty %}
<p class="editor__hint">No songs match.</p>
{% endfor %}
