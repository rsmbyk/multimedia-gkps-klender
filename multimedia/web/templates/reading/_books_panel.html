{% for group in books_groups %}
<section class="group" data-testament="{{ group.testament }}">
  <h3 class="group__head" data-label-tb="{{ group.tb_label }}"
      data-label-sim="{{ group.sim_label }}">{{ group.label }}</h3>
  <ul>
    {% for book in group.books %}
    <li><a class="book" href="{% url 'web-bible-book' book.id %}"
           data-name="{{ book.tb_name }}" data-sim="{{ book.sim_name }}"
           data-tb-code="{{ book.tb_abbr }}" data-sim-code="{{ book.sim_abbr }}"
           data-has-tb="{{ book.has_tb|yesno:'true,false' }}"
           data-has-sim="{{ book.has_sim|yesno:'true,false' }}"
           data-tip="{{ book.display }}{% if book.other %} — {{ book.other }}{% endif %}"
           aria-label="{{ book.display }}{% if book.other %} ({{ book.other }}){% endif %}"{% if book.current %} aria-current="true"{% endif %}>
      <span class="book__n">{{ book.display }}</span>
      <span class="book__a">{{ book.abbr }}</span>
      {% if book.other %}<span class="book__s">{{ book.other }}</span>{% endif %}</a></li>
    {% endfor %}
  </ul>
</section>
{% endfor %}
