{% load static %}

<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ book.name }} - Multimedia GKPS Klender</title>

    <link rel="shortcut icon" type="image/png" href="{% static 'assets/gkps.png' %}">

    <link rel="stylesheet" href="{% static 'libs/fomantic/semantic.min.css' %}">

    <link rel="stylesheet" href="{% static 'styles/multimedia.css' %}">
    <link rel="stylesheet" href="{% static 'styles/semantic.css' %}">

    <script src="{% static 'libs/jquery/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'libs/axios/axios.min.js' %}"></script>
    <script src="{% static 'libs/fomantic/semantic.min.js' %}"></script>
    <script src="{% static 'libs/rxjs/rxjs.umd.min.js' %}"></script>

    <script type="module" src="{% static 'web/songs/songs/index.js' %}"></script>

    <script>const bookId = parseInt('{{ book.id }}')</script>
</head>
<body>
    <div class="fullPage">
        <div class="growingChild">
            <div class="ui center aligned padded text container">
                <div class="ui fluid search" id="search-song">
                    <div class="ui icon input">
                        <input class="prompt" type="text" placeholder="Search">
                        <i class="search icon"></i>
                    </div>
                    <div class="results"></div>
                </div>
            </div>

            <div class="ui padded text container">
                <div class="ui breadcrumb" id="breadcrumb" style="display: none">
                    <a class="section" href="{% url 'web-songs-books' %}">Home</a>
                    <i class="right chevron icon divider"></i>
                    <div class="active section" id="breadcrumb-book"></div>
                </div>

                <div class="ui header">
                    <div class="ui placeholder" id="placeholder-book-info">
                        <div class="header">
                            <div class="line"></div>
                            <div class="line"></div>
                        </div>
                    </div>

                    <div class="content">
                        <span id="book-name"></span>
                    </div>
                </div>

                <div class="ui primary button" id="btn-add-song" style="display: none">
                    <i class="plus icon"></i>
                    <span class="text">Tambah Lagu</span>
                </div>
            </div>

            <div class="ui fitted divider"></div>

            <div class="growingChild scrolling fillRemaining">
                <div class="ui middle aligned padded grid fillRemaining" id="view-error" style="display: none">
                    <div class="center aligned column">
                        <div class="ui icon header">
                            <i class="bug icon"></i>
                            <div class="content">Network Error</div>
                        </div>
                    </div>
                </div>

                <div class="ui middle aligned padded grid fillRemaining" id="view-empty" style="display: none">
                    <div class="center aligned column">
                        <div class="ui icon header">
                            <i class="frown outline icon"></i>
                            <div class="content">No Songs</div>
                        </div>
                    </div>
                </div>

                <div class="ui padded text container" id="placeholder-song-list">
                    <div class="ui very relaxed divided list">
                        <div class="item">
                            <div class="content">
                                <div class="ui placeholder">
                                    <div class="header">
                                        <div class="line"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="item">
                            <div class="content">
                                <div class="ui placeholder">
                                    <div class="header">
                                        <div class="line"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="item">
                            <div class="content">
                                <div class="ui placeholder">
                                    <div class="header">
                                        <div class="line"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="item">
                            <div class="content">
                                <div class="ui placeholder">
                                    <div class="header">
                                        <div class="line"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="ui padded text container" id="container-song-list" style="display: none">
                    <div class="ui very relaxed divided selection list" id="song-list"></div>
                </div>
            </div>
        </div>
    </div>

    {% include 'songs/songs/modals/edit-song.html' %}

    {% include 'songs/songs/modals/delete-song.html' %}

</body>
</html>
