{% load static %}

<div class="ui tiny modal" id="modal-edit-song">
    <div class="header" id="modal-edit-song-header"></div>

    <div class="content">
        <div class="ui form" id="form-edit-song">
            <div class="field" style="display: none">
                <label for="form-edit-song-id">ID</label>
                <input type="text"
                       name="id"
                       placeholder="ID"
                       id="form-edit-song-id">
            </div>

            <div class="field" style="display: none">
                <label for="form-edit-song-book-id">Book ID</label>
                <input type="text"
                       name="bookId"
                       placeholder="Book ID"
                       id="form-edit-song-book-id">
            </div>

            <div class="required field">
                <label for="form-edit-song-title">Title</label>
                <input type="text"
                       name="title"
                       placeholder="Enter song title"
                       id="form-edit-song-title">
            </div>

            <div class="inline field">
                <div class="ui checkbox">
                    <input type="checkbox"
                           name="no_title"
                           tabindex="0"
                           class="hidden"
                           id="form-edit-song-no-title">
                    <label for="form-edit-song-no-title">No Title</label>
                </div>
            </div>

            <div class="ui error message" id="form-edit-song-error-message-title"></div>
            <div class="ui error message" id="form-edit-song-error-message-non-field"></div>
        </div>
    </div>

    <div class="actions">
        <div class="ui cancel button" id="modal-edit-song-button-cancel">
            Cancel
        </div>

        <div class="ui primary right labeled icon approve button" id="modal-edit-song-button-create">
            <i class="plus icon"></i>
            Create
        </div>

        <div class="ui positive right labeled icon approve button" id="modal-edit-song-button-save">
            <i class="save icon"></i>
            Save
        </div>
    </div>
</div>
