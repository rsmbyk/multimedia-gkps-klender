<div class="ui tiny modal" id="modal-edit-book">
    <div class="header" id="modal-edit-book-header"></div>

    <div class="content">
        <div class="ui form" id="form-edit-book">
            <div class="field" style="display: none">
                <label for="form-edit-book-id">ID</label>
                <input type="text"
                       name="id"
                       placeholder="Book ID"
                       id="form-edit-book-id">
            </div>

            <div class="required field">
                <label for="form-edit-book-name">Name</label>
                <input type="text"
                       name="name"
                       placeholder="Enter book name"
                       id="form-edit-book-name">
            </div>

            <div class="ui error message" id="form-edit-book-error-message-name"></div>
            <div class="ui error message" id="form-edit-book-error-message-non-field"></div>
        </div>
    </div>

    <div class="actions">
        <div class="ui cancel button"  id="modal-edit-book-button-cancel">
            Cancel
        </div>

        <div class="ui right labeled primary approve icon button" id="modal-edit-book-button-create">
            <i class="plus icon"></i>
            Create
        </div>

        <div class="ui right labeled green approve icon button" id="modal-edit-book-button-save">
            <i class="save icon"></i>
            Save
        </div>
    </div>
</div>
