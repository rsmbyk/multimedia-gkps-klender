<div class="ui scrolling tiny modal" id="modal-edit-tatib">
    <i class="close icon"></i>

    <div class="header" id="modal-edit-tatib-header"></div>

    <div class="scrolling content">
        <div class="ui form" id="modal-edit-tatib-form">
            <div class="field" style="display: none">
                <label for="modal-edit-tatib-form-id">ID</label>
                <input type="text"
                       name="id"
                       placeholder="Tatib ID"
                       id="modal-edit-tatib-form-id">
            </div>

            <div class="required field">
                <label for="modal-edit-tatib-form-name">Name</label>
                <input type="text"
                       name="name"
                       placeholder="Enter name"
                       id="modal-edit-tatib-form-name">
            </div>

            <div class="inline field">
                <div class="ui checked checkbox">
                    <input type="checkbox"
                           name="noDate"
                           checked=""
                           id="modal-edit-tatib-form-date-checkbox">
                    <label for="modal-edit-tatib-form-date-checkbox">Specify Date</label>
                </div>
            </div>

            <div class="field">
                <label for="modal-edit-tatib-form-date">Date</label>
                <div class="ui input left icon">
                    <i class="calendar icon"></i>
                    <input type="text"
                           name="date"
                           placeholder="Pick up a date"
                           readonly
                           id="modal-edit-tatib-form-date">
                </div>
            </div>

            <div class="ui calendar"></div>

            <div class="ui error message" id="modal-edit-tatib-form-error-message-name"></div>
            <div class="ui error message" id="modal-edit-tatib-form-error-message-date"></div>
            <div class="ui error message" id="modal-edit-tatib-form-error-message-non-field"></div>
        </div>
    </div>

    <div class="actions">
        <div class="ui cancel button"  id="modal-edit-tatib-button-cancel">
            Cancel
        </div>

        <div class="ui right labeled primary approve icon button" id="modal-edit-tatib-button-create">
            <i class="plus icon"></i>
            <span>Create</span>
        </div>

        <div class="ui right labeled green approve icon button" id="modal-edit-tatib-button-save">
            <i class="save icon"></i>
            <span>Save</span>
        </div>
    </div>
</div>
