{% load static %}

<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Project Settings - Multimedia GKPS Klender</title>

    <link rel="shortcut icon" type="image/png" href="{% static 'assets/gkps.png' %}">

    <link rel="stylesheet" href="{% static 'libs/fomantic/semantic.min.css' %}">

    <link rel="stylesheet" href="{% static 'styles/multimedia.css' %}">
    <link rel="stylesheet" href="{% static 'styles/semantic.css' %}">

    <script src="{% static 'libs/jquery/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'libs/fomantic/semantic.min.js' %}"></script>
    <script src="{% static 'libs/rxjs/rxjs.umd.min.js' %}"></script>

    <script type="module" src="{% static 'obs/project/settings/index.js' %}"></script>
</head>
<body>
    <div class="fullPage">
        <div class="growingChild">
            <div class="scrolling fillRemaining">
                <div class="ui padded text container">
                    <div class="ui small header">Project Settings</div>
                </div>

                <div class="ui padded text container">
                    <div class="ui form" id="project-settings-form">
                        <div class="field">
                            <label for="project-settings-form-title-text-colour">Title Text Colour</label>
                            <div class="ui labeled action input">
                                <a class="ui icon label" id="project-settings-form-title-text-colour-button-reset">
                                    <i class="sync alternate icon"></i>
                                </a>
                                <input type="text"
                                    name="titleTextColour"
                                    placeholder="Hex color (#??????)">

                                <div class="ui icon button" id="project-settings-form-title-text-colour-button-apply">
                                    <i class="check icon"></i>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label for="project-settings-form-content-text-colour">Content Text Colour</label>
                            <div class="ui labeled action input">
                                <a class="ui icon label" id="project-settings-form-content-text-colour-button-reset">
                                    <i class="sync alternate icon"></i>
                                </a>
                                <input type="text"
                                    name="contentTextColour"
                                    placeholder="Hex color (#??????)">

                                <div class="ui icon button" id="project-settings-form-content-text-colour-button-apply">
                                    <i class="check icon"></i>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label for="project-settings-form-background-colour">Background Colour</label>
                            <div class="ui labeled action input">
                                <a class="ui icon label" id="project-settings-form-background-colour-button-reset">
                                    <i class="sync alternate icon"></i>
                                </a>
                                <input type="text"
                                    name="backgroundColour"
                                    placeholder="Hex color (#??????)">

                                <div class="ui icon button" id="project-settings-form-background-colour-button-apply">
                                    <i class="check icon"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
