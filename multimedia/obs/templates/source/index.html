{% load static %}

<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>OBS Songs Source</title>

    <link rel="stylesheet" href="{% static 'common/fomantic/semantic.css' %}">
    <link rel="stylesheet" href="{% static 'common/icomoon/style.css' %}">
    <link rel="stylesheet" href="{% static 'obs/songs/css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'obs/songs/css/source/styles.css' %}">
    <link rel="stylesheet" href="{% static 'obs/songs/css/source/themes/default.css' %}">

    <script src="{% static 'common/jquery/jquery-3.6.0.js' %}"></script>
    <script src="{% static 'common/fomantic/semantic.js' %}"></script>
    <script type="module" src="{% static 'obs/songs/js/common/bc.js' %}"></script>
    <script type="module" src="{% static 'obs/songs/js/source/index.js' %}"></script>

</head>
<body style="background-color: transparent">
    <div class="ui flat inverted fluid segment transition" id="song-segment">
        <a class="ui inverted huge right corner label">
            <i class="inverted icomoon-note icon"></i>
        </a>

        <div class="ui very compact padded grid">
            <div class="column">
                <div class="ui inverted large header">
                    <div class="sub header" id="song-book-info">
                        <span id="song-book-number">HAL 1</span> : <span id="song-verse-number">3</span></div>
                    <span id="song-title">Jahowa Sihol Pujionku</span>
                </div>
            </div>
        </div>

        <div class="ui inverted divider"></div>

        <div class="ui very compact padded grid">
            <div class="column">
                <div class="ui inverted massive center aligned header" id="song-lyric">
                    Sai holong atei-Mu Jahowa, papandei au mamuji Goran-Mu.
                    <br>
                    Sai ulang asal puas hata, ningon botul mamuji hu Bamu.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
