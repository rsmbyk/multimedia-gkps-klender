<div class="ui overlay fullscreen modal growingModal" id="modal-settings">
    <i class="close icon"></i>

    <div class="header">
        Settings
    </div>

    <div class="scrolling content fillRemaining">
        <div class="ui form" id="modal-settings-form">
            <div class="field">
                <label for="modal-settings-form-title-size-input">Title Text Size</label>
                <div class="ui labeled action input">
                    <a class="ui icon label" id="modal-settings-form-title-size-button-reset">
                        <i class="sync alternate icon"></i>
                    </a>

                    <input type="text"
                           name="titleSize"
                           placeholder="in px (default: 18)"
                           id="modal-settings-form-title-size-input">

                    <div class="ui icon button" id="modal-settings-form-title-size-button-apply">
                        <i class="check icon"></i>
                    </div>
                </div>
                <div class="ui slider" id="modal-settings-form-title-size-slider"></div>
            </div>

            <div class="field">
                <label for="modal-settings-form-content-size-input">Content Text Size</label>
                <div class="ui labeled action input">
                    <a class="ui icon label" id="modal-settings-form-content-size-button-reset">
                        <i class="sync alternate icon"></i>
                    </a>

                    <input type="text"
                           name="contentSize"
                           placeholder="in px (default: 32)"
                           id="modal-settings-form-content-size-input">

                    <div class="ui icon button" id="modal-settings-form-content-size-button-apply">
                        <i class="check icon"></i>
                    </div>
                </div>
                <div class="ui slider" id="modal-settings-form-content-size-slider"></div>
            </div>

            <div class="field">
                <label for="modal-settings-form-text-colour">Text Colour</label>
                <div class="ui labeled action input">
                    <a class="ui icon label" id="modal-settings-form-text-colour-button-reset">
                        <i class="sync alternate icon"></i>
                    </a>
                    <input type="text"
                           name="textColour"
                           placeholder="Hex color (#??????)"
                           id="modal-settings-form-text-colour">

                    <div class="ui icon button" id="modal-settings-form-text-colour-button-apply">
                        <i class="check icon"></i>
                    </div>
                </div>
            </div>

            <div class="field">
                <label for="modal-settings-form-background-colour">Background Colour</label>
                <div class="ui labeled action input">
                    <a class="ui icon label" id="modal-settings-form-background-colour-button-reset">
                        <i class="sync alternate icon"></i>
                    </a>
                    <input type="text"
                           name="backgroundColour"
                           placeholder="Hex color (#??????)"
                           id="modal-settings-form-background-colour">

                    <div class="ui icon button" id="modal-settings-form-background-colour-button-apply">
                        <i class="check icon"></i>
                    </div>
                </div>
            </div>

            <div class="field">
                <label for="modal-settings-form-label-colour">Label Colour</label>
                <div class="ui labeled action input">
                    <a class="ui icon label" id="modal-settings-form-label-colour-button-reset">
                        <i class="sync alternate icon"></i>
                    </a>
                    <input type="text"
                           name="labelColour"
                           placeholder="Hex color (#??????)"
                           id="modal-settings-form-label-colour">

                    <div class="ui icon button" id="modal-settings-form-label-colour-button-apply">
                        <i class="check icon"></i>
                    </div>
                </div>
            </div>

            <div class="field">
                <label for="modal-settings-form-opacity-input">Opacity</label>
                <div class="ui labeled input">
                    <a class="ui icon label" id="modal-settings-form-opacity-button-reset">
                        <i class="sync alternate icon"></i>
                    </a>
                    <input type="text"
                           name="opacity"
                           id="modal-settings-form-opacity-input"
                           readonly="">
                </div>
                <div class="ui bottom aligned labeled slider" id="modal-settings-form-opacity-slider"></div>
            </div>
        </div>
    </div>
</div>
