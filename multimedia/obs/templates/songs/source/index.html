{% load static %}

<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Source - OBS Songs Plugin</title>

    <link rel="shortcut icon" type="image/png" href="{% static 'assets/gkps.png' %}">

    <link rel="stylesheet" href="{% static 'libs/fomantic/semantic.min.css' %}">
    <link rel="stylesheet" href="{% static 'libs/icomoon/style.css' %}">

    <link rel="stylesheet" href="{% static 'obs/songs/source/styles.css' %}">
    <link rel="stylesheet" href="{% static 'obs/songs/source/themes/default.css' %}">

    <script src="{% static 'libs/jquery/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'libs/rxjs/rxjs.umd.min.js' %}"></script>
    <script src="{% static 'libs/fomantic/semantic.min.js' %}"></script>

    <script type="module" src="{% static 'obs/songs/common/bc.js' %}"></script>

    <script type="module" src="{% static 'obs/songs/source/index.js' %}"></script>
    <script type="module" src="{% static 'obs/songs/source/settings.js' %}"></script>
</head>
<body style="background-color: transparent">
    <div class="ui inverted raised fluid flat segment hidden transition" id="song-segment">
        <a class="ui inverted right corner big label">
            <i class="inverted icomoon-note icon"></i>
        </a>

        <div class="ui padded very compact grid">
            <div class="column" id="song-info">
                <div class="ui inverted header">
                    <div class="sub header" id="song-book-info">
                        <span id="song-book-number"></span> : <span id="song-verse-number"></span></div>
                    <span id="song-title"></span>
                </div>
            </div>
        </div>

        <div class="ui inverted divider"></div>

        <div class="ui padded very compact grid">
            <div class="column">
                <div class="ui center aligned inverted header" id="song-lyric"></div>
            </div>
        </div>
    </div>
</body>
</html>
