<div class="ui overlay fullscreen modal" id="modal-paste">
    <div class="header">
        Quick Paste
    </div>

    <div class="content">
        <div class="ui form" id="modal-paste-form">
            <div class="required field">
                <label for="modal-paste-form-lyric">Lyric</label>
                <textarea type="text"
                          name="lyric"
                          placeholder="Enter lyric here"
                          rows="12"
                          id="modal-paste-form-lyric"
                          style="resize: none"></textarea>
            </div>
        </div>
    </div>

    <div class="actions">
        <div class="ui cancel button" id="modal-paste-button-cancel">
            Cancel
        </div>
        <div class="ui right labeled primary approve icon button" id="modal-paste-button-paste">
            <i class="clipboard icon"></i>
            <span>Paste</span>
        </div>
    </div>
</div>
