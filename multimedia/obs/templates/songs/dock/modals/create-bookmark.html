<div class="ui overlay fullscreen modal" id="modal-create-bookmark">
    <i class="close icon"></i>

    <div class="header">
        Create Bookmark
    </div>

    <div class="scrolling content">
        <div class="ui form" id="modal-create-bookmark-form">
            <div class="required field">
                <label for="modal-create-bookmark-form-name">Name</label>
                <input type="text"
                       name="name"
                       placeholder="Enter bookmark name"
                       id="modal-create-bookmark-form-name">
            </div>

            <div class="inline field">
                <div class="ui checked checkbox">
                    <input type="checkbox"
                           checked=""
                           name="noDate"
                           id="modal-create-bookmark-form-date-checkbox">
                    <label for="modal-create-bookmark-form-date-checkbox">Specify Date</label>
                </div>
            </div>

            <div class="field">
                <label for="modal-create-bookmark-form-date">Date</label>
                <div class="ui calendar">
                    <div class="ui input left icon">
                        <i class="calendar icon"></i>
                        <input type="text"
                               name="date"
                               placeholder="Pick up a date"
                               id="modal-create-bookmark-form-date">
                    </div>
                </div>
            </div>

            <div class="ui error message" id="modal-create-bookmark-form-error-message-name"></div>
            <div class="ui error message" id="modal-create-bookmark-form-error-message-date"></div>
            <div class="ui error message" id="modal-create-bookmark-form-error-message-non-field"></div>
        </div>
    </div>

    <div class="actions">
        <div class="ui primary right labeled icon approve button" id="modal-create-bookmark-button-create">
            <i class="plus icon"></i>
            <span>Create</span>
        </div>
    </div>
</div>
