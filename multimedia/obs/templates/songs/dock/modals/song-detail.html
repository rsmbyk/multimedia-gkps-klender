<div class="ui coupled overlay fullscreen topActions modal growingModal" id="modal-song-detail">
    <i class="close icon"></i>

    <div class="ui small header">
        <div class="ui placeholder" id="modal-song-detail-placeholder-song-info">
            <div class="header">
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </div>

        <div class="content">
            <span class="copyCursor"
                  id="modal-song-detail-song-title"
                  data-content="Copied to clipboard"
                  data-position="bottom left"
                  data-variation="tiny inverted">
            </span>
            <div class="sub header" id="modal-song-detail-song-book-number"></div>
        </div>
    </div>

    <div class="actions">
        <div class="ui left floated small green button" id="modal-song-detail-button-save">
            <i class="save icon"></i>
            <span>Save</span>
        </div>
        <div class="ui left floated small red button" id="modal-song-detail-button-delete">
            <i class="trash icon"></i>
            <span>Remove</span>
        </div>

        <div class="ui buttons" id="modal-song-detail-button-group-display-all">
            <div class="ui right labeled small primary icon button hasPopup modal-song-detail-button-display-all"
                 data-content="Display all verses"
                 data-position="bottom right"
                 data-variation="tiny inverted"
                 >
                <i class="desktop icon"></i>
                <span>Display</span>
            </div>
        </div>

        <div class="ui buttons" id="modal-song-detail-button-group-display-bookmarked">
            <div class="ui small teal icon button"
                 id="modal-song-detail-button-display-bookmarked"
                 data-content="Display bookmarked verses only"
                 data-position="bottom center"
                 data-variation="tiny inverted"
                 >
                <i class="bookmark icon"></i>
            </div>
            <div class="ui right labeled small primary icon button modal-song-detail-button-display-all"
                 data-content="Display all verses"
                 data-position="bottom right"
                 data-variation="tiny inverted"
                 >
                <i class="desktop icon"></i>
                <span>Display</span>
            </div>
        </div>
    </div>

    <div class="content fillRemaining" id="modal-song-detail-view-error" style="display: none">
        <div class="ui middle aligned padded grid" style="height: 100%">
            <div class="center aligned column">
                <div class="ui tiny icon header">
                    <i class="bug icon"></i>
                    <div class="content">Network Error</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content fillRemaining" id="modal-song-detail-view-empty" style="display: none">
        <div class="ui middle aligned padded grid" style="height: 100%">
            <div class="center aligned column">
                <div class="ui tiny icon header">
                    <i class="frown outline icon"></i>
                    <div class="content">No Verses</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content fillRemaining" id="modal-song-detail-placeholder-verse-list">
        <div class="ui divided list items">
            <div class="item">
                <div class="content">
                    <div class="description">
                        <div class="ui placeholder">
                            <div class="paragraph">
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="item">
                <div class="content">
                    <div class="description">
                        <div class="ui placeholder">
                            <div class="paragraph">
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                                <div class="line"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="content scrolling fillRemaining" id="modal-song-detail-container-verse-list">
        <div class="ui divided ordered list items" id="modal-song-detail-verse-list"></div>
    </div>
</div>
