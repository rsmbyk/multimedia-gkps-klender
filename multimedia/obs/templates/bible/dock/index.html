{% load static %}

<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dock - OBS Bible Plugin</title>

    <link rel="shortcut icon" type="image/png" href="{% static 'assets/gkps.png' %}">

    <link rel="stylesheet" href="{% static 'libs/fomantic/semantic.min.css' %}">

    <link rel="stylesheet" href="{% static 'styles/semantic.css' %}">
    <link rel="stylesheet" href="{% static 'styles/multimedia.css' %}">
    <link rel="stylesheet" href="{% static 'styles/themes/default.css' %}">

    <script src="{% static 'libs/jquery/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'libs/fomantic/semantic.min.js' %}"></script>
    <script src="{% static 'libs/axios/axios.min.js' %}"></script>
    <script src="{% static 'libs/rxjs/rxjs.umd.min.js' %}"></script>
    <script src="{% static 'libs/hotkeys/hotkeys.min.js' %}"></script>

    <script type="module" src="{% static 'obs/bible/dock/index.js' %}"></script>
    <script type="module" src="{% static 'obs/bible/dock/tabs/bible.js' %}"></script>
    <script type="module" src="{% static 'obs/bible/dock/tabs/display.js' %}"></script>
    <script type="module" src="{% static 'obs/bible/dock/tabs/display/controls.js' %}"></script>
    <script type="module" src="{% static 'obs/bible/dock/tabs/display/hotkeys.js' %}"></script>
    <script type="module" src="{% static 'obs/bible/dock/tabs/history.js' %}"></script>
    <script type="module" src="{% static 'obs/bible/dock/tabs/settings.js' %}"></script>
</head>
<body>
    <div class="ui bottom fixed inverted four item small icon mobile menu">
        <a class="blue item" data-tab="tab-bible" id="tab-menu-bible">
            <i class="bible icon"></i>
            <span class="text">Bible</span>
        </a>
        <a class="blue item" data-tab="tab-browse">
            <i class="book open icon"></i>
            <span class="text">Browse</span>
        </a>
        <a class="blue item" data-tab="tab-display">
            <i class="tv icon"></i>
            <span class="text">Display</span>
        </a>
        <a class="blue item" data-tab="tab-history">
            <i class="history icon"></i>
            <span class="text">History</span>
        </a>
    </div>

    <div class="ui tab" data-tab="tab-bible">
        {% include 'bible/dock/tabs/bible.html' %}
    </div>

    <div class="ui tab" data-tab="tab-browse">
        {% include 'bible/dock/tabs/browse.html' %}
    </div>

    <div class="ui tab" data-tab="tab-display">
        {% include 'bible/dock/tabs/display.html' %}
    </div>

    <div class="ui tab" data-tab="tab-history">
        {% include 'bible/dock/tabs/history.html' %}
    </div>

    {% include 'common/settings.html' %}

</body>
</html>
