<div class="growingChild" id="tab-display">
    <div class="ui padded text container" style="display: flex; justify-content: space-between">
        <div>
            <div class="ui tiny circular icon button" id="display-button-settings">
                <i class="wrench icon"></i>
            </div>
            <div class="ui tiny inverted floating circular icon dropdown button hasPopup dropdown-versions"
                 id="display-dropdown-versions"
                 data-content="Bahasa"
                 data-position="bottom center"
                 data-variation="inverted">
                <i class="language icon"></i>
                <div class="menu"></div>
            </div>
        </div>
        <div>
            <div class="ui labeled tiny green icon button"
                 id="display-button-status-active">
                <i class="eye icon"></i>
                <span class="text">Active</span>
            </div>
            <div class="ui inverted labeled tiny red icon button"
                 id="display-button-status-inactive">
                <i class="eye slash icon"></i>
                <span class="text">Inactive</span>
            </div>
        </div>
    </div>

    <div class="ui center aligned padded one column grid unselectable">
        <div class="column">
            <div class="ui inverted tiny header">
                <div class="ui dark inverted placeholder" id="display-placeholder-chapter-number">
                    <div class="header">
                        <div class="full line"></div>
                        <div class="full line"></div>
                    </div>
                </div>

                <div class="content">
                    <span id="display-book-name"></span>
                    <div class="sub header" id="display-chapter-number"></div>
                </div>
            </div>
        </div>
        <div class="column">
            <div class="ui inverted tiny header">
                <div class="content">
                    <div class="sub header">Ayat</div>
                    <span id="display-verse-number"></span>
                </div>

                <div class="ui inverted dark placeholder" id="display-placeholder-verse-number">
                    <div class="header">
                        <div class="full line"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="ui text container growingChild fillRemaining">
        <div class="ui top attached tiny fluid inverted buttons">
            <div class="ui icon button hasPopup"
                 id="display-button-prev-verse"
                 data-content="Previous Verse"
                 data-position="top center"
                 data-variation="inverted">
                <i class="angle left icon"></i>
            </div>
            <div class="ui icon button"
                 id="button-focus-indicator">
                <i class="cross icon"></i>
            </div>
            <div class="ui icon button hasPopup"
                 id="display-button-next-verse"
                 data-content="Next Verse"
                 data-position="top center"
                 data-variation="inverted">
                <i class="angle right icon"></i>
            </div>
        </div>

        <div class="ui attached inverted raised segment" id="display-placeholder-passage" style="overflow-y: auto">
            <div class="ui center aligned one column compact grid">
                <div class="column">
                    <div class="ui inverted placeholder">
                        <div class="header">
                            <div class="line"></div>
                        </div>
                    </div>
                </div>
                <div class="column">
                    <div class="ui inverted placeholder">
                        <div class="paragraph">
                            <div class="line"></div>
                            <div class="line"></div>
                            <div class="line"></div>
                            <div class="line"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="ui attached inverted raised segment" id="display-container-passage" style="overflow-y: auto">
            <div class="ui center aligned one column compact grid unselectable">
                <div class="column" id="display-container-verse-title">
                    <div class="ui inverted small header">
                        <div class="content">
                            <div class="sub header" id="display-verse-title"></div>
                        </div>
                    </div>
                </div>
                <div class="column">
                    <div class="ui inverted small header">
                        <div class="content">
                            <span id="display-verse-text"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
