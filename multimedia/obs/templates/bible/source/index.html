{% load static %}

<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Source - OBS Bible Plugin</title>

    <link rel="shortcut icon" type="image/png" href="{% static 'assets/gkps.png' %}">

    <link rel="stylesheet" href="{% static 'libs/fomantic/semantic.min.css' %}">

    <link rel="stylesheet" href="{% static 'obs/bible/source/styles.css' %}">
    <link rel="stylesheet" href="{% static 'obs/bible/source/themes/default.css' %}">

    <script src="{% static 'libs/jquery/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'libs/rxjs/rxjs.umd.min.js' %}"></script>
    <script src="{% static 'libs/fomantic/semantic.min.js' %}"></script>

    <script type="module" src="{% static 'obs/bible/source/index.js' %}"></script>
    <script type="module" src="{% static 'obs/bible/source/settings.js' %}"></script>
</head>
<body style="background-color: transparent">
    <div class="ui inverted raised fluid flat segment hidden transition" id="passage-segment">
        <a class="ui inverted right corner huge label">
            <i class="inverted bible icon"></i>
        </a>

        <div class="ui padded very compact grid">
            <div class="column">
                <div class="ui inverted medium header" id="passage-verse-reference">
                    <span id="passage-book-name"></span> <span id="passage-chapter-number"></span> : <span id="passage-verse-number"></span>
                </div>
            </div>
        </div>

        <div class="ui inverted divider"></div>

        <div class="ui padded very compact grid">
            <div class="column">
                <div class="ui inverted large header" id="passage-verse">
                    <div class="sub header" id="passage-verse-title"></div>
                    <span id="passage-verse-text"></span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
