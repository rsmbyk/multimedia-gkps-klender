name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [develop, main]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect test scope
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      run_e2e: ${{ steps.detect.outputs.run_e2e }}
      e2e_modules: ${{ steps.detect.outputs.e2e_modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: detect
        name: Classify changes and discover E2E modules
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from scripts.ci_test_scope import changed_paths, docs_only

          def api_json(url):
              request = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          def last_full_e2e_sha():
              """Return the latest successful PR run whose browser shards all passed."""
              repository = os.environ['REPOSITORY']
              query = urllib.parse.urlencode({
                  'event': 'pull_request', 'branch': os.environ['PR_HEAD_REF'], 'per_page': 100,
              })
              endpoint = f'https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs?{query}'
              try:
                  runs = api_json(endpoint).get('workflow_runs', [])
                  current_run = os.environ.get('GITHUB_RUN_ID')
                  runs.sort(key=lambda run: run.get('created_at', ''), reverse=True)
                  for run in runs:
                      if str(run.get('id')) == current_run or run.get('conclusion') != 'success':
                          continue
                      if run.get('head_branch') != os.environ['PR_HEAD_REF']:
                          continue
                      matching_pr = next((
                          pr for pr in run.get('pull_requests', [])
                          if str(pr.get('number')) == os.environ['PR_NUMBER']
                      ), None)
                      if not matching_pr:
                          continue
                      jobs = api_json(run['jobs_url']).get('jobs', [])
                      browser_jobs = [
                          job for job in jobs if job.get('name', '').startswith('Browser E2E / ')
                      ]
                      if browser_jobs and all(job.get('conclusion') == 'success' for job in browser_jobs):
                          # A prior run's pull_requests entry reflects the PR's *current*
                          # head. The run's own head_sha is the commit that was tested.
                          return run.get('head_sha')
              except (OSError, ValueError, KeyError, urllib.error.URLError) as error:
                  print(f'Could not find a previous full E2E run ({type(error).__name__}); rerunning safely.')
              return None

          event_name = os.environ['EVENT_NAME']
          if event_name == 'pull_request':
              paths = changed_paths(os.environ.get('PR_BASE_SHA'), os.environ.get('PR_HEAD_SHA'))
          elif event_name == 'push':
              paths = changed_paths(os.environ.get('PUSH_BEFORE'), os.environ.get('PUSH_AFTER'))
          else:
              paths = None

          relevant = paths is None or not docs_only(paths)
          run_e2e = False
          if relevant and event_name == 'push':
              run_e2e = True
          elif relevant and event_name == 'pull_request' and os.environ.get('PR_DRAFT') != 'true':
              action = os.environ.get('EVENT_ACTION')
              if action != 'synchronize':
                  run_e2e = True
              else:
                  previous_sha = last_full_e2e_sha()
                  if not previous_sha:
                      run_e2e = True
                  else:
                      new_paths = changed_paths(previous_sha, os.environ.get('PR_HEAD_SHA'))
                      run_e2e = new_paths is None or not docs_only(new_paths)

          modules = sorted(
              f'tests.e2e.{path.stem}'
              for path in Path('tests/e2e').glob('test_*.py')
          )
          if not modules:
              raise SystemExit('No tests/e2e/test_*.py modules found for the browser test matrix.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'relevant={str(relevant).lower()}\n')
              output.write(f'run_e2e={str(run_e2e).lower()}\n')
              output.write(f'e2e_modules={json.dumps(modules)}\n')
          print(f'Relevant test changes: {relevant}; browser E2E scheduled: {run_e2e}; modules: {len(modules)}')
          PY

  fast:
    name: Fast checks
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-fast-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: multimedia_ci
          POSTGRES_USER: multimedia_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multimedia_ci -d multimedia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://multimedia_ci@127.0.0.1:5432/multimedia_ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Django system check
        run: python manage.py check
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static files for manifest storage
        run: python manage.py collectstatic --noinput
      - name: Run all non-E2E tests
        run: python manage.py test --exclude-tag=e2e --noinput -v 1

  browser-e2e:
    name: Browser E2E / ${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        module: ${{ fromJson(needs.changes.outputs.e2e_modules) }}
    concurrency:
      group: ci-e2e-${{ github.event.pull_request.number || github.ref }}-${{ matrix.module }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: multimedia_ci
          POSTGRES_USER: multimedia_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multimedia_ci -d multimedia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://multimedia_ci@127.0.0.1:5432/multimedia_ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Collect static files for manifest storage
        run: python manage.py collectstatic --noinput
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Verify browser launch
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              browser.close()
          PY
      - name: Run E2E module
        env:
          TEST_MODULE: ${{ matrix.module }}
        run: python manage.py test "$TEST_MODULE" --noinput -v 1

  result:
    name: CI result
    if: always()
    needs: [changes, fast, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require all scheduled jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          RUN_E2E: ${{ needs.changes.outputs.run_e2e }}
          FAST_RESULT: ${{ needs.fast.result }}
          E2E_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed; CI cannot determine which tests are required."
            exit 1
          fi
          if [ "$RELEVANT" != "true" ]; then
            echo "Docs-only change; application tests were not required."
            exit 0
          fi
          if [ "$FAST_RESULT" != "success" ]; then
            echo "Fast checks did not pass (result: $FAST_RESULT)."
            exit 1
          fi
          if [ "$RUN_E2E" = "true" ] && [ "$E2E_RESULT" != "success" ]; then
            echo "Browser E2E did not pass (result: $E2E_RESULT)."
            exit 1
          fi
          echo "All tests scheduled for this event passed."
